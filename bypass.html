<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCRAFT SPACE | تخطي الروابط</title>
    <link rel="icon" type="image/jpeg" href="cCraft.jpg">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        /* ════════════════════════════════════════
           نفس ستايل الموقع الأساسي
           ════════════════════════════════════════ */
        :root {
            --ink:    #07080f;
            --ink2:   #0c0e1c;
            --ink3:   #131628;
            --violet: #8b5cf6;
            --cyan:   #00f2fe;
            --border: rgba(255,255,255,0.07);
            --glow-v: rgba(139,92,246,0.18);
            --tr:     all 0.22s cubic-bezier(0.4,0,0.2,1);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--ink);
            color: #f0f0ff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* الخلفية والنجوم (مطابقة للموقع) */
        .bg-canvas {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 100% 70% at 15% 10%, rgba(139,92,246,0.09) 0%, transparent 60%),
                radial-gradient(ellipse 80%  60% at 85% 80%, rgba(0,242,254,0.07)  0%, transparent 60%),
                var(--ink);
        }

        .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .star {
            position: absolute; border-radius: 50%;
            background: white; opacity: 0;
            animation: twinkle var(--d, 4s) var(--del, 0s) ease infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.6; transform: scale(1); }
        }

        /* حاوية المحتوى */
        .main-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* تصميم الكارد (مطابق للـ nav-grid) */
        .bypass-card {
            width: min(600px, 95%);
            background: rgba(255,255,255,0.025);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-bottom: 3px solid var(--violet);
            border-radius: 24px;
            padding: 35px;
            text-align: center;
            animation: cardIn 0.6s ease both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-wrap {
            margin: 25px 0;
            position: relative;
        }

        .url-input {
            width: 100%;
            background: var(--ink3);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.95rem;
            text-align: left;
            transition: var(--tr);
        }

        .url-input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 20px rgba(0,242,254,0.15);
        }

        /* زر التخطي (مطابق لأزرار الموقع) */
        .action-btn {
            position: relative;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid rgba(139,92,246,0.3);
            background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(0,242,254,0.1));
            color: #fff;
            font-weight: 900;
            font-size: 1.05rem;
            cursor: pointer;
            transition: var(--tr);
            overflow: hidden;
        }

        .action-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(139,92,246,0.3);
            background: linear-gradient(135deg, var(--violet), var(--cyan));
            color: var(--ink);
        }

        .result-area {
            margin-top: 30px;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .key-box {
            background: var(--ink);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            font-family: 'Fira Code', monospace;
            color: var(--cyan);
            font-size: 1.1rem;
            word-break: break-all;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        .loader {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            display: inline-block;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* اللوجو المتوهج */
        .logo-small {
            width: 80px; height: 80px;
            border-radius: 50%;
            border: 2px solid var(--violet);
            margin-bottom: 15px;
            box-shadow: 0 0 20px var(--glow-v);
        }
    </style>
</head>
<body>
    <div class="bg-canvas"></div>
    <div class="stars" id="starsContainer"></div>

    <div class="main-content">
        <div class="bypass-card">
            <img src="cCraft.jpg" alt="Logo" class="logo-small">
            <h2 style="font-weight: 900; font-size: 1.8rem; margin-bottom: 8px;">تخطي الروابط</h2>
            <p style="color: #7878a0; font-size: 0.9rem;">أدخل رابط LootLabs أو PlatoRelay للحصول على المفتاح</p>

            <div class="input-wrap">
                <input type="text" id="keyUrl" class="url-input" placeholder="https://links.lootlabs.gg/s?..." dir="ltr">
            </div>

            <button id="startBtn" class="action-btn" onclick="startBypass()">
                <span id="btnText">ابدأ عملية التخطي</span>
            </button>

            <div id="statusText" style="margin-top: 15px; font-size: 0.8rem; color: #7878a0;"></div>

            <div id="resultArea" class="result-area">
                <div style="color: #4ade80; font-weight: 800; margin-bottom: 10px;">تم استخراج المفتاح بنجاح!</div>
                <div id="keyValue" class="key-box">XXXXX-XXXXX-XXXXX</div>
                <button class="action-btn" style="padding: 10px; font-size: 0.85rem; background: var(--ink3);" onclick="copyKey()">
                    نسخ المفتاح إلى الحافظة
                </button>
            </div>
        </div>
        
        <a href="index.html" style="margin-top: 25px; color: #7878a0; text-decoration: none; font-size: 0.85rem; font-weight: 700;">← العودة للرئيسية</a>
    </div>

    <script>
        // توليد النجوم (نفس كود الموقع)
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = star.style.height = Math.random() * 2 + 1 + 'px';
            star.style.setProperty('--d', Math.random() * 3 + 2 + 's');
            star.style.setProperty('--del', Math.random() * 5 + 's');
            starsContainer.appendChild(star);
        }

        async function startBypass() {
            const url = document.getElementById('keyUrl').value;
            const btn = document.getElementById('startBtn');
            const btnText = document.getElementById('btnText');
            const status = document.getElementById('statusText');
            const resultArea = document.getElementById('resultArea');
            const keyValue = document.getElementById('keyValue');

            if (!url) return alert("يرجى إدخال الرابط أولاً!");

            btn.disabled = true;
            btnText.innerHTML = '<span class="loader"></span> جاري المعالجة...';
            status.innerText = "البوت يقوم بتخطي الإعلانات الآن، يرجى الانتظار (60 ثانية تقريباً)...";
            resultArea.style.display = "none";

            try {
                const response = await fetch('https://Anas9vmhh.pythonanywhere.com/api/bypass', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                
                const data = await response.json();

                if (data.success) {
                    keyValue.innerText = data.key;
                    resultArea.style.display = "block";
                    status.innerText = "تمت العملية بنجاح!";
                } else {
                    status.innerText = "خطأ: " + (data.error || "فشل استخراج المفتاح");
                }
            } catch (error) {
                status.innerText = "فشل الاتصال بالسيرفر. تأكد من أن الـ API يعمل.";
            } finally {
                btn.disabled = false;
                btnText.innerText = "ابدأ عملية التخطي";
            }
        }

        function copyKey() {
            const key = document.getElementById('keyValue').innerText;
            navigator.clipboard.writeText(key);
            alert("تم النسخ!");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCRAFT SPACE | تخطي الروابط</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8a2be2;
            --secondary: #00ffff;
            --bg: #0a0a0a;
            --card-bg: #151515;
            --text: #ffffff;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية النجوم المتحركة */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.3);
            border: 1px solid rgba(0, 255, 255, 0.1);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        h1 {
            color: var(--secondary);
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--primary);
            background: #202020;
            color: white;
            font-family: 'Tajawal', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Tajawal', sans-serif;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 255, 0.4);
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 1.5rem;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }

        .loading {
            color: var(--secondary);
            animation: pulse 1.5s infinite;
        }

        .error { color: #ff4d4d; border: 1px solid #ff4d4d; }
        .success { color: #00ff00; border: 1px solid #00ff00; }

        .result-box {
            margin-top: 1.5rem;
            display: none;
        }

        .key-display {
            background: #202020;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed var(--secondary);
            word-break: break-all;
            margin-bottom: 10px;
            font-family: monospace;
            color: var(--secondary);
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="container">
        <h1>CCRAFT SPACE | Bypass</h1>
        <p style="font-size: 0.8rem; color: #aaa; margin-bottom: 1.5rem;">تخطي روابط PlatoRelay / LootLabs تلقائياً</p>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="ضع رابط LootLabs هنا...">
        </div>

        <button id="startBtn">ابدأ التخطي الآن</button>

        <div id="statusBox" class="status"></div>

        <div id="resultBox" class="result-box">
            <div class="key-display" id="keyText">المفتاح سيظهر هنا</div>
            <button onclick="copyKey()" style="background: var(--secondary); color: #000;">نسخ المفتاح</button>
        </div>
    </div>

    <script>
        // تحديد اسم اليوزر والريبو تلقائياً من رابط GitHub Pages
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const REPO_OWNER = window.location.hostname.split('.')[0];
        const REPO_NAME = pathSegments[0] || '';

        // Personal Access Token الخاص بإرسال الـ Dispatch
        const GITHUB_TOKEN = "github_pat_XXXXXXXXXXXXXX";

        const startBtn = document.getElementById('startBtn');
        const statusBox = document.getElementById('statusBox');
        const resultBox = document.getElementById('resultBox');
        const keyText = document.getElementById('keyText');

        startBtn.addEventListener('click', async () => {
            const url = document.getElementById('urlInput').value;
            if (!url) return alert('يرجى وضع الرابط أولاً!');

            startBtn.disabled = true;
            statusBox.style.display = 'block';
            statusBox.className = 'status loading';
            statusBox.innerText = 'جاري إرسال الأوامر لـ GitHub Actions... يرجى الانتظار';
            resultBox.style.display = 'none';

            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        event_type: 'run-bypass',
                        client_payload: { url: url }
                    })
                });

                if (res.status === 204) {
                    statusBox.className = 'status success';
                    statusBox.innerText = 'تم تشغيل البوت بنجاح! يمكنك متابعة العملية من تبويب Actions في المستودع.';
                } else {
                    statusBox.className = 'status error';
                    statusBox.innerText = 'فشل الاتصال بـ GitHub API. تأكد من صلاحيات الـ Token ووجود حدث run-bypass.';
                }
            } catch (err) {
                statusBox.className = 'status error';
                statusBox.innerText = 'حدث خطأ في الاتصال بالخادم.';
                console.error(err);
            } finally {
                startBtn.disabled = false;
            }
        });

        function copyKey() {
            const text = keyText.innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('تم نسخ المفتاح بنجاح!');
            });
        }
    </script>
</body>
</html>

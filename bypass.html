<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCRAFT SPACE | تخطي الروابط</title>
    <link rel="icon" type="image/jpeg" href="cCraft.jpg">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ink:    #07080f;
            --ink2:   #0c0e1c;
            --ink3:   #131628;
            --violet: #8b5cf6;
            --cyan:   #00f2fe;
            --border: rgba(255,255,255,0.07);
            --tr:     all 0.22s cubic-bezier(0.4,0,0.2,1);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--ink);
            color: #f0f0ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-canvas {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: radial-gradient(ellipse 100% 70% at 15% 10%, rgba(139,92,246,0.09) 0%, transparent 60%), var(--ink);
        }

        .bypass-card {
            position: relative; z-index: 1;
            width: min(500px, 95%);
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-bottom: 3px solid var(--violet);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
        }

        .url-input {
            width: 100%;
            background: var(--ink3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            color: #fff;
            margin: 20px 0;
            text-align: left;
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--violet), var(--cyan));
            color: var(--ink);
            font-weight: 900;
            cursor: pointer;
            transition: var(--tr);
        }

        .action-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(139,92,246,0.3); }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,242,254,0.05);
            border: 1px dashed var(--cyan);
            border-radius: 10px;
            display: none;
        }

        #keyValue { font-family: 'Fira Code', monospace; color: var(--cyan); word-break: break-all; margin: 10px 0; }

        .loader {
            width: 18px; height: 18px; border: 2px solid #000; border-top-color: transparent; border-radius: 50%; display: inline-block; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="bg-canvas"></div>

    <div class="bypass-card">
        <h2 style="font-weight: 900;">تخطي الروابط</h2>
        <input type="text" id="keyUrl" class="url-input" placeholder="ضع الرابط هنا (LootLabs / PlatoRelay)" dir="ltr">
        
        <button id="startBtn" class="action-btn" onclick="startBypass()">
            <span id="btnText">ابدأ التخطي الآن</span>
        </button>

        <div id="statusMsg" style="margin-top: 15px; font-size: 0.8rem; color: #7878a0;"></div>

        <div id="resultBox" class="result-box">
            <div style="font-weight: 800; color: #4ade80;">تم استخراج المفتاح!</div>
            <div id="keyValue"></div>
            <button class="action-btn" style="padding: 8px; font-size: 0.8rem; background: var(--ink3); color: #fff;" onclick="copyKey()">نسخ</button>
        </div>
    </div>

    <script>
        async function startBypass() {
            const url = document.getElementById('keyUrl').value;
            const btn = document.getElementById('startBtn');
            const btnText = document.getElementById('btnText');
            const status = document.getElementById('statusMsg');
            const resultBox = document.getElementById('resultBox');

            if (!url) return alert("يرجى وضع الرابط!");

            btn.disabled = true;
            btnText.innerHTML = '<span class="loader"></span> جاري العمل...';
            status.innerText = "البوت يحاول تخطي الإعلانات، انتظر 60 ثانية...";
            resultBox.style.display = "none";

            try {
                // استخدام رابط HTTPS المؤكد لـ Anas9vmhh
                const response = await fetch('https://Anas9vmhh.pythonanywhere.com/api/bypass', {
                    method: 'POST',
                    mode: 'cors', // التأكد من تفعيل وضع CORS
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ url: url })
                });
                
                if (!response.ok) {
                    throw new Error(`Server returned status ${response.status}`);
                }

                const data = await response.json();

                if (data.success) {
                    document.getElementById('keyValue').innerText = data.key;
                    resultBox.style.display = "block";
                    status.innerText = "نجحت العملية!";
                } else {
                    status.innerText = "خطأ من البوت: " + data.error;
                }
            } catch (error) {
                console.error("Bypass Error:", error);
                status.innerText = "فشل الاتصال: " + error.message + ". تأكد من عمل Reload في PythonAnywhere.";
            } finally {
                btn.disabled = false;
                btnText.innerText = "ابدأ التخطي الآن";
            }
        }

        function copyKey() {
            const key = document.getElementById('keyValue').innerText;
            navigator.clipboard.writeText(key);
            alert("تم النسخ!");
        }
    </script>
</body>
</html>

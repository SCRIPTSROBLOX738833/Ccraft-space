// 🔔 إرسال إشعار لصاحب السكربت (لايك) — ما بيبعتش لنفسه، ومحتاج المستخدم يكون مسجل دخول عشان نعرف اسمه
function notifyAuthor(authorUid, text) {
    if (!authorUid || !currentUser || authorUid === currentUser.uid) return;
    push(ref(db, `notifications/${authorUid}`), {
        type: 'like',
        text,
        timestamp: Date.now(),
    }).catch(() => {});

let allScripts   = [];
let filteredIds  = null;
let activeFilter = 'all';
let activeSort   = 'newest';
let activeKeyFilter = 'all';
let activeTagFilter = null;

const codeStore = new Map();

function incrementViews(id) {
    const vRef = ref(db, `scripts/${id}/views`);
    get(vRef).then(snap => {
        const newViews = (snap.exists() ? snap.val() : 0) + 1;
        set(vRef, newViews);
    }).catch(() => {});
}

let unsafeNameSet = new Set();

function normalizeScriptName(name) {
    return (name || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

async function loadUnsafeNames() {
    try {
        const snap = await get(ref(db, 'unsafeScripts'));
        unsafeNameSet = new Set();
        if (snap.exists()) {
            Object.values(snap.val()).forEach(u => {
                if (u.originalName) unsafeNameSet.add(normalizeScriptName(u.originalName));
            });
        }
    } catch { unsafeNameSet = new Set(); }
}

async function loadScripts() {
    await loadUnsafeNames();
    const snap = await get(ref(db,'scripts'));
    const data = snap.exists() ? snap.val() : {};

    allScripts = Object.entries(data)
        .map(([id,s]) => ({id,...s}))
        .filter(s => s.id && s.title && s.title.trim()) // ✅ استبعاد السجلات التالفة
        .filter(s => !unsafeNameSet.has(normalizeScriptName(s.title))); // 🚫 إخفاء السكربتات المُحذّر منها
    document.getElementById('scriptCount').innerText = allScripts.length;

    renderTagsFilter();

    const q = getQuery();
    renderScripts(q);
    injectStructuredData();
}

function getQuery() {
    return new URLSearchParams(location.search).get('search')?.toLowerCase().trim() || '';
}

function sortScripts(arr) {
    const s = [...arr];
    if (activeSort === '__ai__' && window.__aiScoreMap) {
        return s.sort((a,b)=>(window.__aiScoreMap[b.id]||0)-(window.__aiScoreMap[a.id]||0));
    }
    if (activeSort === 'newest')  return s.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
    if (activeSort === 'oldest')  return s.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
    if (activeSort === 'likes')   return s.sort((a,b)=>(b.likes||0)-(a.likes||0));
    if (activeSort === 'rating')  return s.sort((a,b)=>{
        const ra = a.votes ? a.rating/a.votes : 0;
        const rb = b.votes ? b.rating/b.votes : 0;
        return rb - ra;
    });
    return s;
}

/* ============================================================
   🏷️ فلتر التاجات الديناميكي
   ============================================================ */
function renderTagsFilter() {
    const row = document.getElementById('tagsFilterRow');
    const allTags = new Set();
    allScripts.forEach(s => (s.tags||[]).forEach(t => allTags.add(t)));
    if (!allTags.size) { row.style.display = 'none'; return; }
    row.style.display = 'flex';
    row.innerHTML = `<span class="sort-label">${ICONS.tag} تاجات:</span>` +
        [...allTags].map(t => `<button type="button" class="filter-btn" data-tag="${escHTML(t)}">#${escHTML(t)}</button>`).join('');
    row.querySelectorAll('[data-tag]').forEach(btn => {
        btn.addEventListener('click', () => {
            const t = btn.dataset.tag;
            if (activeTagFilter === t) {
                activeTagFilter = null;
                btn.classList.remove('active');
            } else {
                row.querySelectorAll('[data-tag]').forEach(b => b.classList.remove('active'));
                activeTagFilter = t;
                btn.classList.add('active');
            }
            renderScripts(document.getElementById('searchScripts').value.toLowerCase());
        });
    });
}

document.querySelectorAll('[data-key]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-key]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeKeyFilter = btn.dataset.key;
        renderScripts(document.getElementById('searchScripts').value.toLowerCase());
    });
});

const PAGE_SIZE = 8;
let visibleCount = PAGE_SIZE;
let currentResults = [];

function renderScripts(query = '') {
    const list = document.getElementById('scriptsList');
    list.innerHTML = '';

    let results = allScripts;

    if (filteredIds) {
        results = results.filter(s => filteredIds.includes(s.id));
    }
    if (activeFilter !== 'all') {
        results = results.filter(s => (s.category||'') === activeFilter);
    }
    if (activeKeyFilter === 'yes') results = results.filter(s => s.hasKey || s.key);
    if (activeKeyFilter === 'no')  results = results.filter(s => !s.hasKey && !s.key);
    if (activeTagFilter) results = results.filter(s => Array.isArray(s.tags) && s.tags.includes(activeTagFilter));
    if (query) {
        results = results.filter(s =>
            (s.title||'').toLowerCase().includes(query) ||
            (s.category||'').toLowerCase().includes(query) ||
            (s.map||'').toLowerCase().includes(query) ||
            (s.description||'').toLowerCase().includes(query) ||
            (s.author||'').toLowerCase().includes(query) ||
            (Array.isArray(s.tags) ? s.tags.join(' ').toLowerCase() : '').includes(query)
        );
    }

    results = sortScripts(results);
    document.getElementById('resultsCount').innerText = results.length;

    // 🔄 أي تغيير في البحث أو الفلاتر بيرجّع العدد الظاهر لأول 8 من جديد
    currentResults = results;
    visibleCount = PAGE_SIZE;

    if (!results.length) {
        list.innerHTML = `
            <div class="empty-state">
                <span class="es-icon">${ICONS.search}</span>
                <h3>لا توجد نتائج</h3>
                <p>جرّب كلمات مختلفة أو استخدم البحث الذكي</p>
            </div>`;
        document.getElementById('loadMoreBtn').style.display = 'none';
        return;
    }

    renderVisibleCards();
}

function renderVisibleCards() {
    const list = document.getElementById('scriptsList');
    list.innerHTML = '';

    const now = Date.now();
    const isAiSearch = !!filteredIds;
    const slice = currentResults.slice(0, visibleCount);

    slice.forEach((s, i) => {
        const isNew      = (now - (s.timestamp||0)) < 3 * 24 * 3600 * 1000;
        const isAiMatch  = isAiSearch;
        const avg    = s.votes ? (s.rating / s.votes) : 0;
        const liked  = !!localStorage.getItem(`liked_${s.id}`);
        const rated  = !!localStorage.getItem(`rated_${s.id}`);

        const card = document.createElement('div');
        card.className = 'script-card';
        card.dataset.cat = s.category || 'other';
        card.style.animationDelay = `${Math.min(i * 0.04, 0.4)}s`;

        const codeFull = escHTML(s.code || '-- لا يوجد كود');
        const codeSnippet = escHTML((s.code || '').replace(/\s+/g, ' ').trim().slice(0, 70));

        const hasKeyFlag = !!(s.hasKey || s.key);
        const keyBadge = hasKeyFlag
            ? `<span class="sc-key-badge">${ICONS.lock} يتطلب مفتاح</span>`
            : `<span class="sc-key-badge" style="background:rgba(74,222,128,0.08);border-color:rgba(74,222,128,0.25);color:#4ade80">${ICONS.unlock} بدون مفتاح</span>`;
        const tagBadges = (s.tags||[]).map(t => `<span class="sc-tag-badge">#${escHTML(t)}</span>`).join('');

        const scriptUrl = `script.html?id=${encodeURIComponent(s.id)}`;

        card.innerHTML = `
            <a href="${scriptUrl}" class="sc-card-link" aria-label="${escHTML(s.title || 'عرض السكربت')}">${escHTML(s.title || 'عرض السكربت')}</a>
            ${s.image ? `<div style="overflow:hidden;border-radius:20px 20px 0 0"><img class="sc-thumb" src="${s.image}" alt="صورة السكربت" loading="lazy"></div>` : ''}
            <div class="sc-body">
                <div class="sc-header">
                    <div class="sc-title">${escHTML(s.title || 'بدون عنوان')}</div>
                    ${s.verified ? `<span class="sc-verified-badge" title="سكربت موثّق من الإدارة"><svg width="15" height="15" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="vg-${escHTML(s.id)}" x1="0" y1="0" x2="24" y2="24"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#00f2fe"/></linearGradient></defs><path d="M12 0l2.39 1.7 2.92-.2 1.29 2.6 2.6 1.29-.2 2.92L22.7 10.5 21 12l1.7 2.39-.2 2.92-2.6 1.29-1.29 2.6-2.92-.2L12 24l-2.39-1.7-2.92.2-1.29-2.6-2.6-1.29.2-2.92L1.3 13.5 3 12 1.3 9.61l.2-2.92 2.6-1.29 1.29-2.6 2.92.2L12 0z" fill="url(#vg-${escHTML(s.id)})"/><path d="M17 8.5l-6.2 7-3.3-3.2" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></span>` : ''}
                    ${isAiMatch ? `<span class="sc-ai-badge">${ICONS.sparkle} AI</span>` : ''}
                    ${isNew ? `<span class="sc-new-badge">${ICONS.sparkle} جديد</span>` : ''}
                </div>
                <div class="sc-badges">
                    <span class="sc-cat">${ICONS.folder} ${escHTML(s.category || '—')}</span>
                    ${s.map ? `<span class="sc-map">${ICONS.map} ${escHTML(s.map)}</span>` : ''}
                    ${keyBadge}
                    ${tagBadges}
                </div>
                <div class="sc-stats">
                    <span class="sc-stat">${ICONS.thumb} <strong>${s.likes||0}</strong></span>
                    <span class="sc-stat">${ICONS.eye} <strong>${s.views||0}</strong></span>
                    <span class="sc-stat">${ICONS.user} ${escHTML(s.author||'مجهول')}</span>
                    <span style="margin-right:auto"></span>
                    <div class="sc-stars" data-id="${s.id}" data-rated="${rated}">
                        ${[1,2,3,4,5].map(n=>`<span class="sc-star${n<=Math.round(avg)?' filled':''}" data-v="${n}">${n<=Math.round(avg) ? ICONS.star : ICONS.starOutline}</span>`).join('')}
                        <span class="sc-avg">${s.votes ? avg.toFixed(1) : '—'}</span>
                    </div>
                </div>
                <div class="sc-code-snippet">${ICONS.code} ${codeSnippet}${(s.code || '').length > 70 ? '…' : ''}</div>
                <button type="button" class="sc-preview-btn" onclick="event.stopPropagation(); toggleCodePreview(this)">${ICONS.eye} معاينة سريعة</button>
                <pre class="sc-code-full" onclick="event.stopPropagation()">${codeFull}</pre>
            </div>
            <div class="sc-footer">
                <a class="sc-btn view" href="${scriptUrl}" data-id="${s.id}">${ICONS.eye} عرض</a>
                <button class="sc-btn copy"   data-id="${s.id}">${ICONS.clipboard} نسخ</button>
                <button class="sc-btn like${liked?' liked':''}" data-id="${s.id}" ${liked?'disabled':''}>
                    ${liked ? ICONS.heartFill : ICONS.heartOutline} <span class="lc">${s.likes||0}</span>
                </button>
                <button class="sc-btn report" data-id="${s.id}" title="إبلاغ">${ICONS.flag}</button>
            </div>
        `;

        codeStore.set(s.id, s.code || '');

        // رابط الكارت الكامل (وزر عرض) — رابط <a> حقيقي عشان جوجل يقدر يزحف لصفحة كل سكربت،
        // مع تسجيل عدد المشاهدات لحظة الضغط قبل ما التنقل يحصل
        card.querySelector('.sc-card-link').addEventListener('click', () => incrementViews(s.id));
        card.querySelector('.sc-btn.view').addEventListener('click', () => incrementViews(s.id));

        card.querySelector('.sc-btn.copy').onclick = async e => {
            e.stopPropagation();
            const btn  = e.currentTarget;
            const id   = btn.dataset.id;
            const raw  = codeStore.get(id) || '';
            if (!raw) { alert('لا يوجد كود لهذا السكربت'); return; }
            const code = withCopyWarning(raw, !!s.verified);
            const setDone = () => {
                btn.innerHTML = `${ICONS.check} تم النسخ`;
                btn.style.background = 'rgba(74,222,128,0.15)';
                btn.style.color = 'var(--success)';
                setTimeout(() => {
                    btn.innerHTML = `${ICONS.clipboard} نسخ`;
                    btn.style.background = '';
                    btn.style.color = '';
                }, 2200);
            };
            try {
                await navigator.clipboard.writeText(code);
                setDone();
            } catch {
                const ta = document.createElement('textarea');
                ta.value = code;
                ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                setDone();
            }
        };

        const likeBtn = card.querySelector('.sc-btn.like');
        likeBtn.onclick = async e => {
            e.stopPropagation();
            if (liked || likeBtn.disabled) return;
            const likeRef = ref(db, `scripts/${s.id}/likes`);
            const snap = await get(likeRef);
            const newLikes = (snap.exists() ? snap.val() : 0) + 1;
            await set(likeRef, newLikes);
            likeBtn.querySelector('.lc').innerText = newLikes;
            likeBtn.classList.add('liked');
            likeBtn.innerHTML = `${ICONS.heartFill} <span class="lc">${newLikes}</span>`;
            likeBtn.disabled = true;
            localStorage.setItem(`liked_${s.id}`, 'true');

            // 🔔 إشعار لصاحب السكربت باللايك (لو المستخدم مسجل دخول)
            if (currentUser) {
                const likerName = currentUser.email.split('@')[0];
                notifyAuthor(s.authorUid, `👍 ${likerName} أعجب بسكربتك: ${s.title || 'سكربت'}`);
            }
        };

        card.querySelector('.sc-btn.report').onclick = e => {
            e.stopPropagation();
            location.href = `report.html?id=${s.id}`;
        };

        const starsEl = card.querySelector('.sc-stars');
        starsEl.querySelectorAll('.sc-star').forEach(star => {
            star.addEventListener('click', async e => {
                e.stopPropagation();
                if (starsEl.dataset.rated === 'true') return;
                const val = parseInt(star.dataset.v);
                const rRef = ref(db, `scripts/${s.id}`);
                const snap = await get(rRef);
                let { rating: r=0, votes: v=0, ...rest } = snap.exists() ? snap.val() : {};
                r += val; v++;
                await set(rRef, { ...rest, rating: r, votes: v });
                localStorage.setItem(`rated_${s.id}`, 'true');
                starsEl.dataset.rated = 'true';
                const newAvg = r/v;
                starsEl.querySelectorAll('.sc-star').forEach((st,idx) => {
                    const isFilled = idx+1 <= Math.round(newAvg);
                    st.classList.toggle('filled', isFilled);
                    st.innerHTML = isFilled ? ICONS.star : ICONS.starOutline;
                });
                starsEl.querySelector('.sc-avg').innerText = newAvg.toFixed(1);
            });
        });

        list.appendChild(card);
    });

    const loadMoreBtn = document.getElementById('loadMoreBtn');
    if (visibleCount < currentResults.length) {
        loadMoreBtn.style.display = 'inline-flex';
        loadMoreBtn.innerHTML = `<svg class="i" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg> عرض المزيد (${currentResults.length - visibleCount} متبقي)`;
    } else {
        loadMoreBtn.style.display = 'none';
    }
}

document.getElementById('loadMoreBtn').addEventListener('click', () => {
    visibleCount += PAGE_SIZE;
    renderVisibleCards();
});

function escHTML(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const UNVERIFIED_WARNING = '--[[\n\tتحذير هذا السكربت ليس تم التحقق منه من قبل cCraft space يرجي الحظر منه\n]]\n\n';

// يضيف تعليق تحذير أعلى الكود إذا كان السكربت غير موثّق — تعليق Lua فقط، لا يؤثر على تشغيل السكربت
function withCopyWarning(code, verified) {
    if (verified) return code;
    return UNVERIFIED_WARNING + code;
}

function fuzzyScore(text, query) {
    if (!text || !query) return 0;
    text  = text.toLowerCase().trim();
    query = query.toLowerCase().trim();

    if (text === query)            return 100;
    if (text.startsWith(query))    return 90;
    if (text.includes(query))      return 80;

    const tWords = text.split(/\s+/);
    const qWords = query.split(/\s+/);
    let wordScore = 0;
    for (const qw of qWords) {
        if (tWords.some(tw => tw === qw))          wordScore += 20;
        else if (tWords.some(tw => tw.includes(qw))) wordScore += 12;
        else if (tWords.some(tw => qw.includes(tw) && tw.length > 2)) wordScore += 6;
    }
    if (wordScore > 0) return Math.min(70, wordScore);

    let qi = 0;
    for (let ti = 0; ti < text.length && qi < query.length; ti++) {
        if (text[ti] === query[qi]) qi++;
    }
    if (qi === query.length) return Math.max(5, Math.round(40 * qi / text.length));

    return 0;
}

function normalizeAr(t) {
    return (t||'')
        .replace(/[أإآ]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي')
        .toLowerCase()
        .trim();
}

function parseIntent(query) {
    const q = query.toLowerCase();
    const intent = { category: null, map: null, feature: null };

    if (/game|جيم|لعب|سبيد|speed/.test(q))            intent.category = 'game';
    if (/admin|ادمن|أدمن/.test(q))                      intent.category = 'admin';
    if (/ai|ذكاء|npc/.test(q))                          intent.category = 'ai';

    const maps = ['jailbreak','adopt me','bloxburg','arsenal','bedwars','doors',
                  'da hood','brookhaven','pet sim','murder mystery'];
    for (const m of maps) {
        if (q.includes(m)) { intent.map = m; break; }
    }

    return intent;
}

/* ============================================================
   🔎 ترشيح محلي واسع (عتبة منخفضة جدًا) — بيستخدم قبل ما نبعت
   لـ Nova عشان نقلل عدد السكربتات المرسلة. مش بديل عن smartSearchLocal
   الكامل، ده بس "تصفية أولى" عشان نوفر توكنز ونحسن دقة Nova.
   ============================================================ */
function broadLocalCandidates(query) {
    if (!query || !allScripts.length) return [];
    const qWords = normalizeAr(query).split(/\s+/).filter(w => w.length > 1);
    if (!qWords.length) return [];

    const results = [];
    for (const s of allScripts) {
        const haystack = normalizeAr(
            [s.title, s.category, s.map, s.description, (s.tags || []).join(' ')].join(' ')
        );
        // يكفي إن كلمة واحدة بس من كلمات البحث تكون موجودة (حرفيًا أو جزء من كلمة)
        const matchCount = qWords.filter(w => haystack.includes(w)).length;
        if (matchCount > 0) {
            results.push({ ...s, _preScore: matchCount });
        }
    }
    // الأكتر تطابقًا في المقدمة، عشان لو أكتر من 60 نتيجة نقص الأهم
    return results.sort((a, b) => b._preScore - a._preScore);
}

/* ============================================================
   🔍 البحث المحلي (Fallback) — بيشتغل من غير إنترنت/سيرفر،
   وبيستخدم لو Nova مش متاح أو حصل rate limit
   ============================================================ */
function smartSearchLocal(query) {
    if (!query || !allScripts.length) return [];

    const qNorm   = normalizeAr(query);
    const intent  = parseIntent(query);
    const results = [];

    for (const s of allScripts) {
        let score = 0;
        const title    = normalizeAr(s.title);
        const category = normalizeAr(s.category);
        const map      = normalizeAr(s.map);
        const desc     = normalizeAr(s.description);
        const author   = normalizeAr(s.author);
        const tags     = normalizeAr((s.tags||[]).join(' '));

        score += fuzzyScore(title,    qNorm) * 3.0;
        score += fuzzyScore(category, qNorm) * 1.5;
        score += fuzzyScore(map,      qNorm) * 2.0;
        score += fuzzyScore(desc,     qNorm) * 1.0;
        score += fuzzyScore(author,   qNorm) * 0.5;
        score += fuzzyScore(tags,     qNorm) * 1.5;

        if (intent.category && (s.category||'').toLowerCase() === intent.category) score += 30;
        if (intent.map      && map.includes(intent.map))  score += 25;

        const likes  = s.likes  || 0;
        const rating = s.votes  ? s.rating / s.votes : 0;
        score += Math.min(15, likes  * 0.3);
        score += Math.min(10, rating * 2);

        if ((Date.now() - (s.timestamp||0)) < 7 * 86400000) score += 5;

        if (score > 8) results.push({ ...s, _score: score });
    }

    return results.sort((a, b) => b._score - a._score);
}

/* ============================================================
   🤖 البحث الذكي المدعوم من Nova AI
   ----------------------------------------------------------------
   بنرشّح الأول محليًا (broadLocalCandidates) عشان نقلل عدد
   السكربتات المرسلة، وبعدين نبعت المرشحين لباك إند Nova، والموديل
   بيرجع الـ IDs المطابقة بأي ترتيب كلمات كتبها المستخدم (مثلاً
   "سكربت كيبورد" و"كيبورد سكربت" بيدوا نفس النتيجة).
   لو فشل الاتصال أو حصل rate limit، بيرجع تلقائيًا للبحث المحلي الكامل.
   ============================================================ */
async function novaSearch(query) {
    const candidates = broadLocalCandidates(query);
    const sourceList = candidates.length > 0 ? candidates : allScripts;

    const compactList = sourceList.slice(0, 60).map(s => ({
        id: s.id,
        title: s.title || '',
        category: s.category || '',
        map: s.map || '',
        tags: s.tags || [],
        description: s.description || ''
    }));

    const res = await fetch(`${NOVA_URL}/ai-search-scripts`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, scripts: compactList })
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    console.log('%c[Nova Search] الرد الخام:', 'color:#8b5cf6;font-weight:bold', data);
    console.log('%c[Nova Search] عدد السكربتات المرسلة:', 'color:#8b5cf6;font-weight:bold', compactList.length);

    if (data.error === 'rate_limited') {
        throw new Error('rate_limited');
    }

    const ids = Array.isArray(data.ids) ? data.ids : [];
    // نحول الـ ids المرتبة لنفس شكل نتائج البحث المحلي (id + _score) عشان الترتيب يتحافظ عليه
    return ids
        .map(id => allScripts.find(s => s.id === id))
        .filter(Boolean)
        .map((s, idx) => ({ ...s, _score: ids.length - idx }));
}

function highlightMatch(text, query) {
    if (!query || !text) return escHTML(text);
    const safe = escHTML(text);
    const re   = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
    return safe.replace(re, '<mark style="background:rgba(139,92,246,0.25);color:#c084fc;border-radius:3px;padding:0 2px">$1</mark>');
}

async function aiSearch() {
    const query = document.getElementById('searchScripts').value.trim();
    if (!query) return;

    const btn = document.getElementById('aiSearchBtn');
    btn.disabled = true;
    btn.innerHTML = '<svg class="i spin" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';

    const list = document.getElementById('scriptsList');
    list.innerHTML = `<div class="ai-thinking">
        <div class="ai-dots"><span></span><span></span><span></span></div>
        <span>Nova بتحلل البحث...</span>
    </div>`;

    let results = [];
    let usedFallback = false;

    try {
        results = await novaSearch(query);
    } catch (e) {
        // فشل الاتصال بـ Nova (رفض، rate limit، أو مفيش إنترنت) -> نرجع للبحث المحلي
        console.error('%c[Nova Search] فشل الاتصال:', 'color:#f87171;font-weight:bold', e);
        usedFallback = true;
        results = smartSearchLocal(query);
    }

    if (results.length > 0) {
        filteredIds = results.map(s => s.id);
        const scoreMap = Object.fromEntries(results.map(s => [s.id, s._score]));

        const savedSort = activeSort;
        activeSort = '__ai__';
        window.__aiScoreMap = scoreMap;

        const intent = parseIntent(query);
        let bannerMsg = usedFallback
            ? `🔍 ${results.length} نتيجة (بحث محلي — Nova مش متاح دلوقتي)`
            : `🤖 ${results.length} نتيجة من Nova AI`;
        if (intent.map)      bannerMsg += ` · ماب: ${intent.map}`;
        if (intent.category) bannerMsg += ` · قسم: ${intent.category}`;

        showAiBanner(bannerMsg);
        renderScripts(query);

        activeSort = savedSort;
        delete window.__aiScoreMap;

    } else {
        filteredIds = null;
        const source = usedFallback ? '(بحث محلي — Nova مش متاح دلوقتي)' : '(بحث Nova AI)';
        showAiBanner(`⚠️ لا نتائج دقيقة لـ "${escHTML(query)}" ${source} — عارض الكل`);
        renderScripts('');
    }

    btn.disabled = false;
    btn.innerHTML = '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/></svg><span>بحث ذكي</span>';
}

function showAiBanner(html) {
    const banner = document.getElementById('aiBanner');
    document.getElementById('aiBannerText').innerHTML = html;
    banner.classList.add('show');
}

window.closeAiBanner = function() {
    document.getElementById('aiBanner').classList.remove('show');
    filteredIds = null;
    renderScripts(document.getElementById('searchScripts').value.toLowerCase());
};

document.getElementById('searchScripts').addEventListener('input', e => {
    const q = e.target.value.toLowerCase().trim();
    updateURL(q);
    if (!q) { filteredIds = null; closeAiBanner(); }
    renderScripts(q);
});

document.getElementById('searchScripts').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        e.preventDefault();
        aiSearch();
    }
});

document.getElementById('aiSearchBtn').addEventListener('click', aiSearch);

document.querySelectorAll('.filter-btn[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn[data-cat]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.cat;
        renderScripts(document.getElementById('searchScripts').value.toLowerCase());
    });
});

document.getElementById('sortSelect').addEventListener('change', e => {
    activeSort = e.target.value;
    renderScripts(document.getElementById('searchScripts').value.toLowerCase());
});

function updateURL(q) {
    const url = new URL(location.href);
    q ? url.searchParams.set('search',q) : url.searchParams.delete('search');
    history.replaceState(null,'',url);
}

/* ============================================================
   🗺️ بيانات منظّمة (JSON-LD) لكل سكربت — بتساعد جوجل يفهم إن كل
   سكربت هو "صفحة" منفصلة وليه رابط خاص بيه (script.html?id=...)،
   وده بيشجع جوجل يزحف ويفهرس صفحة كل سكربت لوحدها، مش بس الصفحة دي.
   الرابط الحقيقي <a href> الموجود في كل كارت (sc-card-link) هو
   اللي بيسمح لجوجل يدخل فعليًا لصفحة السكربت، والـ JSON-LD ده
   بيدي سياق إضافي عن المحتوى.
   ============================================================ */
function injectStructuredData() {
    const items = allScripts.slice(0, 200).map((s, idx) => ({
        "@type": "ListItem",
        "position": idx + 1,
        "url": `https://ccraftspace.ddnsking.com/script.html?id=${encodeURIComponent(s.id)}`,
        "name": s.title || 'سكربت Roblox'
    }));

    const ld = {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "itemListElement": items
    };

    const existing = document.getElementById('scriptsListLd');
    if (existing) existing.remove();

    const script = document.createElement('script');
    script.type = 'application/ld+json';
    script.id = 'scriptsListLd';
    script.textContent = JSON.stringify(ld);
    document.head.appendChild(script);
}

// ✅ رسم أولي فوري من البيانات الثابتة (لو موجودة) قبل ما Firebase يرد — بيضمن إن الزائر وبوتات الزحف يشوفوا محتوى حقيقي من أول لحظة
function renderStaticFallback() {
    try {
        const data = window.__SCRIPTS_DATA__;
        if (!data) return;
        allScripts = Object.entries(data)
            .map(([id,s]) => ({id,...s}))
            .filter(s => s.id && s.title && s.title.trim());
        document.getElementById('scriptCount').innerText = allScripts.length;
        renderScripts(getQuery());
        injectStructuredData();
    } catch (e) { /* أي خطأ هنا لا يوقف تحميل الصفحة — Firebase هيكمل عادي بعد كده */ }
}

window.addEventListener('DOMContentLoaded', () => {
    const q = new URLSearchParams(location.search).get('search') || '';
    if (q) document.getElementById('searchScripts').value = q;
    renderStaticFallback();
    loadScripts();
});

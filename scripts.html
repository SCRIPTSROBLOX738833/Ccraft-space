let unsafeNameSet = new Set();

function normalizeScriptName(name) {
    return (name || '').trim().toLowerCase().replace(/\s+/g, ' ');

async function loadUnsafeNames() {
    try {
        const snap = await get(ref(db, 'unsafeScripts'));
        unsafeNameSet = new Set();
        if (snap.exists()) {

async function loadScripts() {

/* ============================================================
   🚀 JSON-LD ItemList — مش عنصر مرئي، مجرد بيانات منظمة قياسية
   بتدّي جوجل قائمة صريحة بكل رابط سكربت في الصفحة دفعة واحدة.
   ده بيسرّع الاكتشاف والفهرسة، ومش له علاقة بإخفاء محتوى عن حد.
   ============================================================ */
function injectScriptsItemListSchema() {
    const old = document.getElementById('scriptsItemListSchema');
    if (old) old.remove();

    const schema = {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "itemListElement": allScripts.map((s, i) => ({
            "@type": "ListItem",
            "position": i + 1,
            "url": `https://ccraftspace.ddnsking.com/script.html?id=${encodeURIComponent(s.id)}`,
            "name": s.title || 'سكربت'
        }))
    };

    const tag = document.createElement('script');
    tag.type = 'application/ld+json';
    tag.id = 'scriptsItemListSchema';
    tag.textContent = JSON.stringify(schema);
    document.head.appendChild(tag);
}

function getQuery() {
    return new URLSearchParams(location.search).get('search')?.toLowerCase().trim() || '';
}

function sortScripts(arr) {
    const s = [...arr];
    if (activeSort === '__ai__' && window.__aiScoreMap) {
        return s.sort((a,b)=>(window.__aiScoreMap[b.id]||0)-(window.__aiScoreMap[a.id]||0));
    }
    if (activeSort === 'newest')  return s.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
    if (activeSort === 'oldest')  return s.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
    if (activeSort === 'likes')   return s.sort((a,b)=>(b.likes||0)-(a.likes||0));
    if (activeSort === 'rating')  return s.sort((a,b)=>{
        const ra = a.votes ? a.rating/a.votes : 0;
        const rb = b.votes ? b.rating/b.votes : 0;
        return rb - ra;
    });
    return s;
}

/* ============================================================

   ============================================================ */
function renderTagsFilter() {
    const row = document.getElementById('tagsFilterRow');
    const allTags = new Set();
    allScripts.forEach(s => (s.tags||[]).forEach(t => allTags.add(t)));
    if (!allTags.size) { row.style.display = 'none'; return; }
    row.style.display = 'flex';
    row.innerHTML = `<span class="sort-label">${ic('hash',13)}تاجات:</span>` +
        [...allTags].map(t => `<button type="button" class="filter-btn" data-tag="${escHTML(t)}">#${escHTML(t)}</button>`).join('');
    row.querySelectorAll('[data-tag]').forEach(btn => {
        btn.addEventListener('click', () => {
            const t = btn.dataset.tag;
            if (activeTagFilter === t) {
                activeTagFilter = null;
                btn.classList.remove('active');
            } else {
                row.querySelectorAll('[data-tag]').forEach(b => b.classList.remove('active'));
                activeTagFilter = t;
                btn.classList.add('active');
            }
            renderScripts(document.getElementById('searchScripts').value.toLowerCase());
        });
    });
}

document.querySelectorAll('[data-key]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-key]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeKeyFilter = btn.dataset.key;
        renderScripts(document.getElementById('searchScripts').value.toLowerCase());
    });
});

const PAGE_SIZE = 8;
let visibleCount = PAGE_SIZE;
let currentResults = [];
let lastQuery = '';

function renderScripts(query = '') {
    const list = document.getElementById('scriptsList');
    list.innerHTML = '';
    lastQuery = query;

    let results = allScripts;

    if (filteredIds) {
        results = results.filter(s => filteredIds.includes(s.id));
    }
    if (activeFilter !== 'all') {
        results = results.filter(s => (s.category||'') === activeFilter);
    }
    if (activeKeyFilter === 'yes') results = results.filter(s => s.hasKey || s.key);
    if (activeKeyFilter === 'no')  results = results.filter(s => !s.hasKey && !s.key);
    if (activeTagFilter) results = results.filter(s => Array.isArray(s.tags) && s.tags.includes(activeTagFilter));

    if (query && !filteredIds) {
        // 🧠 بحث فوري بالكتابة يستخدم نفس محرك التطابق التقريبي/المرادفات
        // بتاع البحث الذكي، بدل مطابقة نصية بسيطة، فيرتب النتائج
        // بالأصلح أولاً ويتحمل الأخطاء الإملائية البسيطة كمان.
        const fuzzy = smartSearchLocal(query, results);
        if (fuzzy.length) {
            // الترتيب الافتراضي وقت البحث هو "الأصلح" — لكن لو المستخدم
            // اختار ترتيب معيّن يدويًا (غير "الأحدث") بنحترم اختياره
            results = activeSort === 'newest' ? fuzzy : sortScripts(fuzzy);
        } else {
            results = sortScripts(results.filter(s =>
                (s.title||'').toLowerCase().includes(query) ||
                (s.category||'').toLowerCase().includes(query) ||
                (s.map||'').toLowerCase().includes(query) ||
                (s.description||'').toLowerCase().includes(query) ||
                (s.author||'').toLowerCase().includes(query) ||
                (Array.isArray(s.tags) ? s.tags.join(' ').toLowerCase() : '').includes(query)
            ));
        }
    } else if (!filteredIds) {
        results = sortScripts(results);
    }
    if (filteredIds) results = sortScripts(results);

    document.getElementById('resultsCount').innerText = results.length;

    // 🔄 أي تغيير في البحث أو الفلاتر بيرجّع العدد الظاهر لأول 8 من جديد
    currentResults = results;
    visibleCount = PAGE_SIZE;

    if (!results.length) {
        list.innerHTML = `
            <div class="empty-state">
                <span class="es-icon">${ic('search',44)}</span>
                <h3>لا توجد نتائج</h3>
                <p>جرّب كلمات مختلفة أو استخدم البحث الذكي ${ic('robot',13)}</p>
            </div>`;
        document.getElementById('loadMoreBtn').style.display = 'none';
        return;
    }

    renderVisibleCards();
}

        card.querySelector('.sc-card-link').addEventListener('click', () => incrementViews(s.id));
        card.querySelector('.sc-btn.view').addEventListener('click', () => incrementViews(s.id));

        card.querySelector('.sc-btn.copy').onclick = async e => {
            e.stopPropagation();
            const btn = e.currentTarget;
            const id   = btn.dataset.id;
            const raw  = codeStore.get(id) || '';
            if (!raw) { alert('لا يوجد كود لهذا السكربت'); return; }
            const code = withCopyWarning(raw, !!s.verified);
            const restore = () => { btn.innerHTML = `${ic('copy',14)}نسخ`; btn.style.background=''; btn.style.color=''; };
            try {
                await navigator.clipboard.writeText(code);
                btn.innerHTML = `${ic('check',14)}تم النسخ`;
                btn.style.background = 'rgba(74,222,128,0.15)';
                btn.style.color = 'var(--success)';
                setTimeout(restore, 2200);
            } catch {
                const ta = document.createElement('textarea');
                ta.value = code;
                ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                btn.innerHTML = `${ic('check',14)}تم`;
                setTimeout(restore, 2000);
            }
        };

        const likeBtn = card.querySelector('.sc-btn.like');
        likeBtn.onclick = async e => {
            e.stopPropagation();
            if (liked || likeBtn.disabled) return;
            const likeRef = ref(db, `scripts/${s.id}/likes`);
            const snap = await get(likeRef);
            const newLikes = (snap.exists() ? snap.val() : 0) + 1;
            await set(likeRef, newLikes);
            likeBtn.querySelector('.lc').innerText = newLikes;
            likeBtn.classList.add('liked');
            likeBtn.querySelector('.like-icon').innerHTML = ic('heartFill', 14);
            likeBtn.disabled = true;
            localStorage.setItem(`liked_${s.id}`, 'true');

            // 💥 أنيميشن: نبضة قلب + رشّة جزيئات صغيرة حوالين الزرار
            likeBtn.classList.add('pulse');
            spawnLikeBurst(likeBtn.querySelector('.like-burst'));
            setTimeout(() => likeBtn.classList.remove('pulse'), 600);

            // 🔔 إشعار لصاحب السكربت باللايك (لو المستخدم مسجل دخول)
            if (currentUser) {
                const likerName = await getMyDisplayName();
                notifyAuthor(s.authorUid, `${likerName} أعجب بسكربتك: ${s.title || 'سكربت'}`);
            }
        };

        card.querySelector('.sc-btn.report').onclick = e => {
            e.stopPropagation();
            location.href = `report.html?id=${s.id}`;
        };

        const starsEl = card.querySelector('.sc-stars');
        const starEls = [...starsEl.querySelectorAll('.sc-star')];

        // ⭐ معاينة عند المرور بالماوس: تلوين كل النجوم لحد النجمة اللي تحتها الماوس (يتوقف تلقائيًا بعد التقييم)
        starEls.forEach(star => {
            star.addEventListener('mouseenter', () => {
                if (starsEl.dataset.rated === 'true') return;
                const v = parseInt(star.dataset.v);
                starEls.forEach(st => st.classList.toggle('hover-fill', parseInt(st.dataset.v) <= v));
            });
        });
        starsEl.addEventListener('mouseleave', () => {
            starEls.forEach(st => st.classList.remove('hover-fill'));
        });

        starEls.forEach(star => {
            star.addEventListener('click', async e => {
                e.stopPropagation();
                if (starsEl.dataset.rated === 'true') return;
                const val = parseInt(star.dataset.v);
                const rRef = ref(db, `scripts/${s.id}`);
                const snap = await get(rRef);
                let { rating: r=0, votes: v=0, ...rest } = snap.exists() ? snap.val() : {};
                r += val; v++;
                await set(rRef, { ...rest, rating: r, votes: v });
                localStorage.setItem(`rated_${s.id}`, 'true');
                starsEl.dataset.rated = 'true';
                const newAvg = r/v;
                starsEl.querySelectorAll('.sc-star').forEach((st,idx) => {
                    st.classList.toggle('filled', idx+1 <= Math.round(newAvg));
                    if (idx+1 <= val) { st.classList.add('just-rated'); setTimeout(()=>st.classList.remove('just-rated'), 450); }
                });
                starsEl.querySelector('.sc-avg').innerHTML = `<strong>${newAvg.toFixed(1)}</strong> (${v})`;
            });
        });

        list.appendChild(card);
    });

    const loadMoreBtn = document.getElementById('loadMoreBtn');
    if (visibleCount < currentResults.length) {
        loadMoreBtn.style.display = 'inline-flex';
        loadMoreBtn.style.alignItems = 'center';

    } else {
        loadMoreBtn.style.display = 'none';
    }
}

function spawnLikeBurst(container) {
    if (!container) return;
    container.innerHTML = '';
    const n = 8;
    for (let i = 0; i < n; i++) {
        const p = document.createElement('span');
        const angle = (Math.PI * 2 * i) / n + (Math.random()*0.4-0.2);
        const dist  = 13 + Math.random()*7;
        p.style.setProperty('--bx', `${Math.cos(angle)*dist}px`);
        p.style.setProperty('--by', `${Math.sin(angle)*dist}px`);
        p.style.background = i % 2 ? '#f87171' : '#fb923c';
        container.appendChild(p);
    }
    setTimeout(() => { container.innerHTML = ''; }, 650);
}

function escHTML(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const UNVERIFIED_WARNING = '--[[\n\tتحذير هذا السكربت ليس تم التحقق منه من قبل cCraft space يرجي الحظر منه\n]]\n\n';

// يضيف تعليق تحذير أعلى الكود إذا كان السكربت غير موثّق — تعليق Lua فقط، لا يؤثر على تشغيل السكربت
function withCopyWarning(code, verified) {
    if (verified) return code;
    return UNVERIFIED_WARNING + code;
}

/* ============================================================
   🔎 محرك المطابقة التقريبية — أقوى من مجرد substring:
   - تطابق كامل / بداية / احتواء (سريع، وزن عالي)
   - تطابق على مستوى الكلمات (يدعم ترتيب مختلف للكلمات)
   - Levenshtein distance محدود لتحمّل الأخطاء الإملائية البسيطة
     (زي "سكريبت" بدل "سكربت" أو حرف زايد/ناقص)
   - Subsequence fallback للحالات الصعبة
   ============================================================ */
function levenshtein(a, b, maxDist) {
    if (Math.abs(a.length - b.length) > maxDist) return maxDist + 1;
    const dp = Array.from({length: a.length+1}, (_,i)=>[i, ...Array(b.length).fill(0)]);
    for (let j=0;j<=b.length;j++) dp[0][j]=j;
    for (let i=1;i<=a.length;i++) {
        let rowMin = Infinity;
        for (let j=1;j<=b.length;j++) {
            const cost = a[i-1]===b[j-1] ? 0 : 1;
            dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
            rowMin = Math.min(rowMin, dp[i][j]);
        }
        if (rowMin > maxDist) return maxDist + 1;
    }
    return dp[a.length][b.length];
}

function fuzzyScore(text, query) {
    if (!text || !query) return 0;
    text  = text.toLowerCase().trim();
    query = query.toLowerCase().trim();

    if (text === query)            return 100;
    if (text.startsWith(query))    return 90;
    if (text.includes(query))      return 80;

    const tWords = text.split(/\s+/);
    const qWords = query.split(/\s+/);
    let wordScore = 0;
    for (const qw of qWords) {
        if (tWords.some(tw => tw === qw))          wordScore += 20;
        else if (tWords.some(tw => tw.includes(qw))) wordScore += 12;
        else if (tWords.some(tw => qw.includes(tw) && tw.length > 2)) wordScore += 6;
        else if (qw.length >= 3 && tWords.some(tw => tw.length >= 3 && levenshtein(tw, qw, 2) <= (qw.length>=6?2:1))) wordScore += 10;
    }
    if (wordScore > 0) return Math.min(70, wordScore);

    if (query.length >= 3) {
        const dist = levenshtein(text.slice(0, query.length+2), query, 2);
        if (dist <= 2) return Math.max(35, 55 - dist*10);
    }

    let qi = 0;
    for (let ti = 0; ti < text.length && qi < query.length; ti++) {
        if (text[ti] === query[qi]) qi++;
    }
    if (qi === query.length) return Math.max(5, Math.round(40 * qi / text.length));

    return 0;
}

function normalizeAr(t) {
    return (t||'')
        .replace(/[أإآ]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي')
        .toLowerCase()
        .trim();
}

/* ============================================================
   🔤 قاموس مرادفات عربي↔إنجليزي لأشهر مصطلحات سكربتات Roblox
   — بيتطبّق على نص البحث نفسه (مش على عناوين السكربتات) عشان لو
   حد كتب "سرقة بيض" يتحول لبحث يشمل "steal egg" كمان، فيطابق
   سكربت اسمه فعليًا "Steal Egg" بالإنجليزي.
   ده شبكة أمان محلية بس، مش بديل عن فهم Nova AI الدلالي.
   ============================================================ */
const SYNONYM_MAP = {
    'سرقة': 'steal', 'سرقه': 'steal', 'اسرق': 'steal',
    'بيض': 'egg', 'بيضة': 'egg', 'بيضه': 'egg',
    'سرعة': 'speed', 'سرعه': 'speed',
    'طيران': 'fly', 'طير': 'fly',
    'قفز': 'jump',
    'قتل': 'kill',
    'اموال': 'money', 'فلوس': 'money', 'كاش': 'cash',
    'مفاتيح': 'keys', 'مفتاح': 'key',
    'زومبي': 'zombie',
    'وحش': 'monster',
    'قوة': 'strength', 'قوه': 'strength',
    'اسلحة': 'weapons', 'سلاح': 'weapon',
    'حماية': 'admin', 'ادمن': 'admin',
    'لانهائي': 'infinite',
    'اوتو': 'auto', 'تلقائي': 'auto',
    'فارم': 'farm', 'زراعة': 'farm', 'زراعه': 'farm',
    'كنز': 'treasure',
    'قتال': 'fight', 'معركة': 'fight', 'معركه': 'fight'
};

// بيوسّع نص البحث (query) بس بالمرادفات الإنجليزية، عشان يطابق
// عناوين إنجليزية زي "Steal Egg" لما حد يكتب "سرقة بيض"
function expandWithSynonyms(text) {
    if (!text) return text;
    let expanded = text;
    for (const [ar, en] of Object.entries(SYNONYM_MAP)) {
        if (text.includes(ar)) expanded += ' ' + en;
    }
    return expanded;
}

function parseIntent(query) {
    const q = query.toLowerCase();
    const intent = { category: null, map: null, feature: null };

    if (/game|جيم|لعب|سبيد|speed/.test(q))            intent.category = 'game';
    if (/admin|ادمن|أدمن/.test(q))                      intent.category = 'admin';
    if (/ai|ذكاء|npc/.test(q))                          intent.category = 'ai';

    const maps = ['jailbreak','adopt me','bloxburg','arsenal','bedwars','doors',
                  'da hood','brookhaven','pet sim','murder mystery'];
    for (const m of maps) {
        if (q.includes(m)) { intent.map = m; break; }
    }

    return intent;
}

/* ============================================================
   🔍 البحث المحلي (يشتغل فورًا مع الكتابة + Fallback لو Nova
   مش متاح) — بيرجّع مصفوفة النتائج المرتبة بالأصلح أولاً.
   بياخد `pool` اختياري (مجموعة سكربتات جاهزة بعد الفلاتر) بدل
   allScripts كاملة، عشان البحث الفوري يحترم الفلاتر النشطة.
   ============================================================ */
function smartSearchLocal(query, pool) {
    const source = pool || allScripts;
    if (!query || !source.length) return [];

    // ✅ نوسّع نص البحث نفسه بالمرادفات (سرقة بيض -> سرقة بيض steal egg)
    const qNorm   = expandWithSynonyms(normalizeAr(query));
    const intent  = parseIntent(query);
    const results = [];

    for (const s of source) {
        let score = 0;
        const title    = normalizeAr(s.title);
        const category = normalizeAr(s.category);
        const map      = normalizeAr(s.map);
        const desc     = normalizeAr(s.description);
        const author   = normalizeAr(s.author);
        const tags     = normalizeAr((s.tags||[]).join(' '));

        score += fuzzyScore(title,    qNorm) * 3.0;
        score += fuzzyScore(category, qNorm) * 1.5;
        score += fuzzyScore(map,      qNorm) * 2.0;
        score += fuzzyScore(desc,     qNorm) * 1.0;
        score += fuzzyScore(author,   qNorm) * 0.5;
        score += fuzzyScore(tags,     qNorm) * 1.5;

        if (intent.category && (s.category||'').toLowerCase() === intent.category) score += 30;
        if (intent.map      && map.includes(intent.map))  score += 25;

        const likes  = s.likes  || 0;
        const rating = s.votes  ? s.rating / s.votes : 0;
        score += Math.min(15, likes  * 0.3);
        score += Math.min(10, rating * 2);

        if ((Date.now() - (s.timestamp||0)) < 7 * 86400000) score += 5;

        if (score > 8) results.push({ ...s, _score: score });
    }

    return results.sort((a, b) => b._score - a._score);
}

/* ============================================================
   🤖 البحث الذكي المدعوم من Nova AI
   ----------------------------------------------------------------
   بيبعت طلب البحث + قائمة مختصرة من السكربتات (من غير الكود) لباك
   إند Nova، والموديل بيرجع الـ IDs المطابقة بأي ترتيب كلمات كتبها
   المستخدم (مثلاً "سكربت كيبورد" و"كيبورد سكربت" بيدوا نفس النتيجة).
   لو فشل الاتصال أو حصل rate limit، بيرجع تلقائيًا للبحث المحلي.
   ============================================================ */
async function novaSearch(query) {
    const compactList = allScripts.map(s => ({
        id: s.id,
        title: s.title || '',
        category: s.category || '',
        map: s.map || '',
        tags: s.tags || [],
        description: s.description || ''
    }));

    const res = await fetch(`${NOVA_URL}/ai-search-scripts`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, scripts: compactList })
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    console.log('%c[Nova Search] الرد الخام:', 'color:#8b5cf6;font-weight:bold', data);
    console.log('%c[Nova Search] عدد السكربتات المرسلة:', 'color:#8b5cf6;font-weight:bold', compactList.length);

    if (data.error === 'rate_limited') {
        throw new Error('rate_limited');
    }

    const ids = Array.isArray(data.ids) ? data.ids : [];
    // نحول الـ ids المرتبة لنفس شكل نتائج البحث المحلي (id + _score) عشان الترتيب يتحافظ عليه
    return ids
        .map(id => allScripts.find(s => s.id === id))
        .filter(Boolean)
        .map((s, idx) => ({ ...s, _score: ids.length - idx }));
}

function highlightMatch(text, query) {
    if (!query || !text) return escHTML(text);
    const safe = escHTML(text);
    const words = query.trim().split(/\s+/).filter(w => w.length >= 2).map(w => w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
    if (!words.length) return safe;
    const re = new RegExp(`(${words.join('|')})`, 'gi');
    return safe.replace(re, '<mark>$1</mark>');
}

async function aiSearch() {
    const query = document.getElementById('searchScripts').value.trim();
    if (!query) return;
    hideSuggestions();

    const btn = document.getElementById('aiSearchBtn');
    btn.disabled = true;
    btn.innerHTML = `${ic('robot',15,'spin')}<span>جاري البحث</span>`;

    const list = document.getElementById('scriptsList');
    list.innerHTML = `<div class="ai-thinking">
        <div class="ai-dots"><span></span><span></span><span></span></div>
        <span>Nova بتحلل البحث...</span>
    </div>`;

    let results = [];
    let usedFallback = false;

    try {
        results = await novaSearch(query);

        // 🛟 Nova ردت بنجاح لكن ملقتش أي تطابق (ids: []) — قبل ما نستسلم
        // ونقول "لا يوجد"، نجرب البحث المحلي (اللي بيفهم مرادفات زي
        // سرقة=steal بيض=egg) كمحاولة أخيرة بدل عرض رسالة سلبية فورًا
        if (results.length === 0) {
            const localResults = smartSearchLocal(query);
            if (localResults.length > 0) {
                results = localResults;
                usedFallback = true;
            }
        }
    } catch (e) {
        // فشل الاتصال بـ Nova (رفض، rate limit، أو مفيش إنترنت) -> نرجع للبحث المحلي
        console.error('%c[Nova Search] فشل الاتصال:', 'color:#f87171;font-weight:bold', e);
        usedFallback = true;
        results = smartSearchLocal(query);
    }

    if (results.length > 0) {
        filteredIds = results.map(s => s.id);
        const scoreMap = Object.fromEntries(results.map(s => [s.id, s._score]));

        const savedSort = activeSort;
        activeSort = '__ai__';
        window.__aiScoreMap = scoreMap;

        const intent = parseIntent(query);
        let bannerMsg = usedFallback
            ? `<strong>${results.length}</strong> نتيجة (بحث محلي احتياطي)`
            : `<strong>${results.length}</strong> نتيجة من Nova AI`;
        if (intent.map)      bannerMsg += ` · ماب: ${intent.map}`;
        if (intent.category) bannerMsg += ` · قسم: ${intent.category}`;

        document.getElementById('aibIcon').innerHTML = ic('robot', 15);
        showAiBanner(bannerMsg);
        renderScripts(query);

        activeSort = savedSort;
        delete window.__aiScoreMap;

    } else {
        filteredIds = null;
        document.getElementById('aibIcon').innerHTML = ic('warning', 15);
        showAiBanner(`لا نتائج لـ "${escHTML(query)}" — عارض الكل`);
        renderScripts('');
    }

    btn.disabled = false;
    btn.innerHTML = `${ic('robot',15)}<span>بحث ذكي</span>`;
}

function showAiBanner(html) {
    const banner = document.getElementById('aiBanner');
    document.getElementById('aiBannerText').innerHTML = html;
    banner.classList.add('show');
}

window.closeAiBanner = function() {
    document.getElementById('aiBanner').classList.remove('show');
    filteredIds = null;
    renderScripts(document.getElementById('searchScripts').value.toLowerCase());
};

/* ============================================================
   💡 اقتراحات فورية (autocomplete) — بتظهر تحت مربع البحث وانت
   بتكتب، بتاخد أفضل 6 نتائج من نفس محرك المطابقة التقريبية،
   وتتحكم فيها بالكيبورد (↑ ↓ Enter Esc)
   ============================================================ */
const suggestBox = document.getElementById('searchSuggest');
let suggestIndex = -1;
let suggestItems = [];

function hideSuggestions() {
    suggestBox.classList.remove('show');
    suggestBox.innerHTML = '';
    suggestIndex = -1;
    suggestItems = [];
}

function renderSuggestions(query) {
    if (!query) { hideSuggestions(); return; }
    const results = smartSearchLocal(query).slice(0, 6);
    if (!results.length) { hideSuggestions(); return; }

    suggestItems = results;
    suggestIndex = -1;
    suggestBox.innerHTML = results.map((s, i) => `
        <div class="ss-item" data-i="${i}">
            ${ic('search',14)}
            <span>${highlightMatch(s.title || 'سكربت', query)}</span>
            <span class="ss-meta">${escHTML(s.category||'')}</span>
        </div>`).join('');
    suggestBox.classList.add('show');

    suggestBox.querySelectorAll('.ss-item').forEach(item => {
        item.addEventListener('click', () => selectSuggestion(parseInt(item.dataset.i)));
    });
}

function selectSuggestion(i) {
    const s = suggestItems[i];
    if (!s) return;
    const input = document.getElementById('searchScripts');
    input.value = s.title || '';
    updateURL(input.value.toLowerCase());
    hideSuggestions();
    filteredIds = null;
    renderScripts(input.value.toLowerCase());
}

document.getElementById('searchScripts').addEventListener('input', e => {
    const q = e.target.value.toLowerCase().trim();
    updateURL(q);
    if (!q) { filteredIds = null; closeAiBanner(); hideSuggestions(); renderScripts(''); return; }
    renderScripts(q);
    renderSuggestions(q);
});

document.getElementById('searchScripts').addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && suggestItems.length) {
        e.preventDefault();
        suggestIndex = Math.min(suggestIndex + 1, suggestItems.length - 1);
        updateSuggestHighlight();
    } else if (e.key === 'ArrowUp' && suggestItems.length) {
        e.preventDefault();
        suggestIndex = Math.max(suggestIndex - 1, -1);
        updateSuggestHighlight();
    } else if (e.key === 'Enter') {
        e.preventDefault();
        if (suggestIndex >= 0 && suggestItems[suggestIndex]) {
            selectSuggestion(suggestIndex);
        } else {
            aiSearch();
        }
    } else if (e.key === 'Escape') {
        hideSuggestions();
    }
});

function updateSuggestHighlight() {
    suggestBox.querySelectorAll('.ss-item').forEach((el, i) => {
        el.classList.toggle('active', i === suggestIndex);
    });
    const active = suggestBox.querySelector('.ss-item.active');
    if (active) active.scrollIntoView({ block: 'nearest' });
}

document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) hideSuggestions();
});

document.getElementById('aiSearchBtn').addEventListener('click', aiSearch);

document.querySelectorAll('.filter-btn[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn[data-cat]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.cat;
        renderScripts(document.getElementById('searchScripts').value.toLowerCase());
    });
});

document.getElementById('sortSelect').addEventListener('change', e => {
    activeSort = e.target.value;
    renderScripts(document.getElementById('searchScripts').value.toLowerCase());
});

function updateURL(q) {
    const url = new URL(location.href);
    q ? url.searchParams.set('search',q) : url.searchParams.delete('search');
    history.replaceState(null,'',url);
}

// ✅ رسم أولي فوري من البيانات الثابتة (لو موجودة) قبل ما Firebase يرد — بيضمن إن الزائر وبوتات الزحف يشوفوا محتوى حقيقي من أول لحظة
function renderStaticFallback() {
    try {
        const data = window.__SCRIPTS_DATA__;
        if (!data) return;
        allScripts = Object.entries(data)
            .map(([id,s]) => ({id,...s}))
            .filter(s => s.id && s.title && s.title.trim());
        document.getElementById('scriptCount').innerText = allScripts.length;
        renderAllScriptsIndex();
        renderScripts(getQuery());
    } catch (e) { /* أي خطأ هنا لا يوقف تحميل الصفحة — Firebase هيكمل عادي بعد كده */ }
}

window.addEventListener('DOMContentLoaded', () => {
    const q = new URLSearchParams(location.search).get('search') || '';
    if (q) document.getElementById('searchScripts').value = q;
    renderStaticFallback();
    loadScripts();
});

</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السكربتات | CCRAFT SPACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>(function(s){s.dataset.zone='11585956',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

<style>
:root {
    --glow-purple: rgba(139, 92, 246, 0.35);
    --glow-cyan:   rgba(0, 242, 254, 0.25);
    --code-bg:     #050810;
    --card-depth:  rgba(6, 8, 20, 0.6);
}
body {
    background:
        radial-gradient(ellipse 80% 50% at 10% 10%, rgba(139,92,246,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 80%, rgba(0,242,254,0.04) 0%, transparent 60%),
        var(--bg-base, #09090f);
    min-height: 100svh;
}
@keyframes riseUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.scripts-layout { max-width: 1120px; margin: 0 auto; padding: 18px 20px 80px; }

/* search */
.search-wrap { display: flex; gap: 10px; background: linear-gradient(145deg, rgba(16,18,32,0.95), rgba(12,12,24,0.9)); border: 1px solid rgba(139,92,246,0.18); border-radius: 16px; padding: 10px 16px; margin-bottom: 22px; align-items: center; animation: riseUp 0.4s cubic-bezier(0.22,1,0.36,1) both; }
.search-wrap span { color: #5a5a78; font-size: 1rem; }
#searchInput { flex: 1; background: transparent; border: none; outline: none; color: #e5e5f5; font-family: 'Tajawal', sans-serif; font-size: 0.92rem; padding: 6px 2px; direction: rtl; }
#searchInput::placeholder { color: #45455f; }

/* section header */
.sec-head { display: flex; align-items: center; gap: 10px; margin: 26px 0 14px; }
.sec-head h2 { font-size: 1.05rem; font-weight: 900; color: #f0f0ff; display: flex; align-items: center; gap: 8px; margin: 0; white-space: nowrap; }
.sec-head::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06); }

/* top-3 leaderboard */
.leaderboard-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; animation: riseUp 0.45s 0.05s cubic-bezier(0.22,1,0.36,1) both; }
.lb-card { background: linear-gradient(145deg, rgba(16,18,32,0.95), rgba(12,12,24,0.9)); border: 1px solid rgba(139,92,246,0.18); border-radius: 18px; padding: 16px 14px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
.lb-card:hover { border-color: rgba(139,92,246,0.4); transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,0,0,0.35); }
.lb-medal { font-size: 1.6rem; display: block; margin-bottom: 6px; }
.lb-name { font-size: 0.85rem; font-weight: 900; color: #e5e5f5; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-count { font-size: 0.72rem; color: #a78bfa; font-weight: 800; }
.lb-card:nth-child(1) { border-color: rgba(251,191,36,0.35); }
.lb-card:nth-child(1) .lb-count { color: #fbbf24; }
@media (max-width: 640px) { .lb-name { font-size: 0.76rem; } }

/* trending strip */
.trend-strip { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; animation: riseUp 0.45s 0.08s cubic-bezier(0.22,1,0.36,1) both; }
.trend-strip::-webkit-scrollbar { height: 5px; }
.trend-strip::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.3); border-radius: 3px; }
.trend-card { flex: 0 0 200px; scroll-snap-align: start; background: linear-gradient(145deg, rgba(16,18,32,0.95), rgba(12,12,24,0.9)); border: 1px solid rgba(0,242,254,0.15); border-radius: 16px; padding: 12px; cursor: pointer; transition: all 0.2s; }
.trend-card:hover { border-color: rgba(0,242,254,0.4); transform: translateY(-2px); }
.trend-title { font-size: 0.82rem; font-weight: 800; color: #e5e5f5; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trend-meta { display: flex; justify-content: space-between; font-size: 0.68rem; color: #45455f; }
.trend-meta .likes { color: #f87171; font-weight: 800; }

/* filters */
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0; }
.filter-pill { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); color: #8a8aa8; border-radius: 50px; padding: 7px 16px; font-size: 0.78rem; font-weight: 800; cursor: pointer; font-family: 'Tajawal', sans-serif; transition: all 0.2s; }
.filter-pill:hover { border-color: rgba(139,92,246,0.3); color: #c4b5fd; }
.filter-pill.active { background: rgba(139,92,246,0.18); border-color: rgba(139,92,246,0.45); color: #c4b5fd; }

/* grid */
.scripts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.sc-card { background: linear-gradient(145deg, rgba(16,18,32,0.95), rgba(12,12,24,0.9)); border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; overflow: hidden; cursor: pointer; transition: all 0.2s; animation: riseUp 0.4s cubic-bezier(0.22,1,0.36,1) both; }
.sc-card:hover { border-color: rgba(139,92,246,0.3); transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.35); }
.sc-thumb { width: 100%; height: 130px; object-fit: cover; display: block; background: #0a0a14; }
.sc-thumb.placeholder { display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #2a2a40; }
.sc-body { padding: 12px 14px 14px; }
.sc-title { font-size: 0.9rem; font-weight: 900; color: #f0f0ff; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.35; min-height: 2.4em; }
.sc-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.sc-tag { font-size: 0.62rem; font-weight: 800; padding: 3px 9px; border-radius: 50px; }
.sc-tag.verified { background: rgba(74,222,128,0.12); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
.sc-tag.unverified { background: rgba(251,191,36,0.1); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
.sc-tag.key { background: rgba(251,191,36,0.08); color: #fbbf24; border: 1px solid rgba(251,191,36,0.25); }
.sc-tag.nokey { background: rgba(74,222,128,0.06); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }
.sc-tag.map { background: rgba(0,242,254,0.07); color: #00d9e8; border: 1px solid rgba(0,242,254,0.2); }
.sc-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; color: #45455f; }
.sc-footer .likes { color: #f87171; font-weight: 800; }
.no-results { text-align: center; padding: 50px 20px; color: #383854; font-size: 0.9rem; grid-column: 1 / -1; }
.no-results .nr-icon { font-size: 2.4rem; display: block; margin-bottom: 10px; }

@media (max-width: 640px) {
    .scripts-layout { padding: 14px 14px 60px; }
    .leaderboard-row { grid-template-columns: 1fr; }
    .scripts-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .sc-thumb { height: 100px; }
    .sc-title { font-size: 0.82rem; min-height: 2.2em; }
}
</style>
</head>
<body>

<header>
    <button onclick="location.href='upload.html'">➕ رفع سكربت</button>
    <button class="nav-button" onclick="location.href='index.html'">العودة للرئيسية</button>
</header>

<div class="scripts-layout">

    <div class="search-wrap">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="ابحث عن سكربت أو لعبة...">
    </div>

    <div class="sec-head"><h2>🏆 الأكثر سكربتات</h2></div>
    <div class="leaderboard-row" id="leaderboardRow">
        <div class="lb-card"><span class="lb-medal">⏳</span><div class="lb-name">جارٍ التحميل...</div></div>
        <div class="lb-card"><span class="lb-medal">⏳</span><div class="lb-name">جارٍ التحميل...</div></div>
        <div class="lb-card"><span class="lb-medal">⏳</span><div class="lb-name">جارٍ التحميل...</div></div>
    </div>

    <div class="sec-head"><h2>🔥 الأكثر رواجاً</h2></div>
    <div class="trend-strip" id="trendStrip"></div>

    <div class="sec-head"><h2>📜 أحدث السكربتات</h2></div>
    <div class="filter-row">
        <button type="button" class="filter-pill" id="filterKeyless">🔓 بدون مفتاح</button>
        <button type="button" class="filter-pill" id="filterVerified">✅ موثّق فقط</button>
    </div>

    <div class="scripts-grid" id="scriptsGrid">
        <div class="no-results"><span class="nr-icon">⏳</span>جارٍ تحميل السكربتات...</div>
    </div>

</div>

<script type="module">
import { supabase } from "./supabase-config.js";
import { guardAgainstBanned } from "./auth-guard.js";

guardAgainstBanned();

// نفس المفاتيح المستخدمة في صفحة عرض السكربت — عشان التطابق
const MAP_ICONS = {
    'Adopt Me':'🏡','Bloxburg':'🏗️','Brookhaven':'🌆','Arsenal':'🔫',
    'Bedwars':'🛏️','Murder Mystery 2':'🔪','Jailbreak':'🚔',
    'Pet Simulator X':'🐾','Doors':'🚪','Da Hood':'🏙️',
    'Anime Fighting Sim':'⚔️','Tower of Hell':'🗼',
};

// توحيد أسماء الألعاب (عربي/إنجليزي/اختلاف كتابة) لاسم موحّد واحد
const MAP_NORMALIZE = {
    'adopt me':'Adopt Me','ادوبت مي':'Adopt Me','ادوبت':'Adopt Me',
    'bloxburg':'Bloxburg','بلوكسبيرغ':'Bloxburg','بلوكس بيرج':'Bloxburg',
    'brookhaven':'Brookhaven','بروكهافن':'Brookhaven','بروك هافن':'Brookhaven',
    'arsenal':'Arsenal','ارسنال':'Arsenal',
    'bedwars':'Bedwars','بيد وورز':'Bedwars','بيدوارز':'Bedwars',
    'murder mystery 2':'Murder Mystery 2','mm2':'Murder Mystery 2','ميردر':'Murder Mystery 2',
    'jailbreak':'Jailbreak','جيلبريك':'Jailbreak','جيل بريك':'Jailbreak',
    'pet simulator x':'Pet Simulator X','بت سيميوليتور':'Pet Simulator X',
    'doors':'Doors','دورز':'Doors',
    'da hood':'Da Hood','داهود':'Da Hood','دا هود':'Da Hood',
    'anime fighting sim':'Anime Fighting Sim','انمي فايتنج':'Anime Fighting Sim',
    'tower of hell':'Tower of Hell','تاور اوف هيل':'Tower of Hell',
};

function normalizeMap(raw) {
    if (!raw) return null;
    const key = raw.trim().toLowerCase();
    return MAP_NORMALIZE[key] || raw.trim();
}

function escHTML(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let allScripts = [];
let activeFilters = { keyless: false, verified: false };

init();

async function init() {
    const { data, error } = await supabase
        .from('scripts')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(200);

    if (error || !data) {
        document.getElementById('scriptsGrid').innerHTML =
            `<div class="no-results"><span class="nr-icon">⚠️</span>تعذّر تحميل السكربتات، حاول تاني</div>`;
        return;
    }

    allScripts = data.map(s => ({ ...s, _map: normalizeMap((s.extra||{}).map) }));

    renderLeaderboard();
    renderTrending();
    renderGrid();

    document.getElementById('filterKeyless').addEventListener('click', () => {
        activeFilters.keyless = !activeFilters.keyless;
        document.getElementById('filterKeyless').classList.toggle('active', activeFilters.keyless);
        renderGrid();
    });
    document.getElementById('filterVerified').addEventListener('click', () => {
        activeFilters.verified = !activeFilters.verified;
        document.getElementById('filterVerified').classList.toggle('active', activeFilters.verified);
        renderGrid();
    });
    document.getElementById('searchInput').addEventListener('input', renderGrid);
}

function renderLeaderboard() {
    const counts = {};
    allScripts.forEach(s => { if (s._map) counts[s._map] = (counts[s._map]||0) + 1; });
    const top3 = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0, 3);

    const row = document.getElementById('leaderboardRow');
    if (!top3.length) {
        row.innerHTML = `<div class="no-results" style="grid-column:1/-1">لا توجد بيانات ألعاب كافية بعد</div>`;
        return;
    }
    const medals = ['🥇','🥈','🥉'];
    row.innerHTML = top3.map(([name, count], i) => `
        <div class="lb-card" data-map="${escHTML(name)}">
            <span class="lb-medal">${medals[i]}</span>
            <div class="lb-name">${MAP_ICONS[name]||'🗺️'} ${escHTML(name)}</div>
            <div class="lb-count">${count} سكربت</div>
        </div>
    `).join('');
    row.querySelectorAll('.lb-card').forEach(el => {
        el.onclick = () => {
            document.getElementById('searchInput').value = el.dataset.map;
            renderGrid();
            document.getElementById('scriptsGrid').scrollIntoView({ behavior: 'smooth' });
        };
    });
}

function renderTrending() {
    const top = [...allScripts]
        .sort((a,b) => (b.likes_count||0) - (a.likes_count||0))
        .slice(0, 10);

    const strip = document.getElementById('trendStrip');
    if (!top.length) { strip.innerHTML = `<div class="no-results">لا يوجد سكربتات رائجة بعد</div>`; return; }

    strip.innerHTML = top.map(s => `
        <div class="trend-card" data-id="${s.id}">
            <div class="trend-title">${escHTML(s.title)}</div>
            <div class="trend-meta">
                <span>${s._map ? (MAP_ICONS[s._map]||'🗺️')+' '+escHTML(s._map) : '🌐 عام'}</span>
                <span class="likes">❤️ ${s.likes_count||0}</span>
            </div>
        </div>
    `).join('');
    strip.querySelectorAll('.trend-card').forEach(el => {
        el.onclick = () => location.href = `script.html?id=${el.dataset.id}`;
    });
}

function renderGrid() {
    const grid = document.getElementById('scriptsGrid');
    const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();

    let list = allScripts.filter(s => {
        if (activeFilters.keyless && s.has_key) return false;
        if (activeFilters.verified && !s.is_verified) return false;
        if (query) {
            const hay = `${s.title} ${s._map||''} ${s.category||''}`.toLowerCase();
            if (!hay.includes(query)) return false;
        }
        return true;
    });

    if (!list.length) {
        grid.innerHTML = `<div class="no-results"><span class="nr-icon">🔍</span>لا توجد سكربتات مطابقة</div>`;
        return;
    }

    grid.innerHTML = list.map(s => `
        <div class="sc-card" data-id="${s.id}">
            ${s.image_base64
                ? `<img class="sc-thumb" src="${s.image_base64}" alt="">`
                : `<div class="sc-thumb placeholder">📜</div>`}
            <div class="sc-body">
                <div class="sc-title">${escHTML(s.title)}</div>
                <div class="sc-tags">
                    <span class="sc-tag ${s.is_verified ? 'verified':'unverified'}">${s.is_verified ? '✅ موثّق':'⚠️ غير موثّق'}</span>
                    <span class="sc-tag ${s.has_key ? 'key':'nokey'}">${s.has_key ? '🔒 مفتاح':'🔓 بدون مفتاح'}</span>
                    ${s._map ? `<span class="sc-tag map">${MAP_ICONS[s._map]||'🗺️'} ${escHTML(s._map)}</span>` : ''}
                </div>
                <div class="sc-footer">
                    <span>${escHTML(s.author_name || 'cCraft Space User')}</span>
                    <span class="likes">❤️ ${s.likes_count||0}</span>
                </div>
            </div>
        </div>
    `).join('');

    grid.querySelectorAll('.sc-card').forEach(el => {
        el.onclick = () => location.href = `script.html?id=${el.dataset.id}`;
    });
}
</script>
</body>
</html>

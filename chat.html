<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>CCRAFT SPACE | شات</title>
<link rel="stylesheet" href="styles.css">
<style>

/* ============================================================
   Chat Page Layout — Full Screen (Mobile Fixed)
   ============================================================ */

html, body {
    height: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
}

/* position:fixed pins the page to the REAL visible viewport on mobile —
   unlike 100vh (which can be taller than what's actually visible when the
   browser's address bar is showing), this never leaves content stranded
   below the fold. --app-height is set/kept in sync by JS as a second,
   independent safety net in case anything overrides the fixed positioning. */
body {
    position: fixed !important;
    inset: 0 !important;
    top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
    width: 100% !important;
    height: var(--app-height, 100dvh) !important;
    display: flex !important;
    flex-direction: column !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
}

.chat-layout {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 0;
    min-height: 0;
    overflow: hidden;
}


/* ============================================================
   Chat Header Bar
   ============================================================ */

.chat-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
}

.back-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.3rem;
    cursor: pointer;
    padding: 4px 6px;
    margin: 0;
    min-width: unset;
    flex-shrink: 0;
    line-height: 1;
    transition: var(--transition);
}

.back-btn:hover { color: var(--text-main); filter: none; transform: scale(1.1); }

.ch-icon {
    width: 40px; height: 40px;
    border-radius: 14px;
    background: var(--accent-gradient);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    box-shadow: 0 4px 14px rgba(139,92,246,0.35);
    flex-shrink: 0;
}

.ch-info { flex: 1; min-width: 0; }
.ch-name { font-size: 0.95rem; font-weight: 900; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch-status {
    font-size: 0.7rem;
    color: var(--success);
    display: flex;
    align-items: center;
    gap: 5px;
}

.ch-status::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--success);
    animation: blink 1.5s ease infinite;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.ch-online {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 50px;
    padding: 5px 10px;
    font-size: 0.68rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    white-space: nowrap;
}

.ch-online .dot { width:6px;height:6px;border-radius:50%;background:var(--success); }


/* ============================================================
   Messages Area
   ============================================================ */

#chatBox {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 0;
    scroll-behavior: smooth;
}

/* Date separator */
.date-sep {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 14px 0 8px;
    color: var(--text-muted);
    font-size: 0.72rem;
    font-weight: 700;
}

.date-sep::before, .date-sep::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-color);
}

/* Message group */
.msg-group {
    display: flex;
    gap: 8px;
    margin-bottom: 2px;
    position: relative;
    max-width: 100%;
}

.msg-group.own {
    flex-direction: row-reverse;
}

/* Avatar */
.msg-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    overflow: hidden;
    border: 1.5px solid rgba(139,92,246,0.25);
    flex-shrink: 0;
    background: #0a0a14;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: var(--transition);
    align-self: flex-end;
    font-size: 0.85rem;
    font-weight: 900;
    color: white;
}

.msg-group.own .msg-avatar { background: var(--accent-gradient); border-color: rgba(139,92,246,0.4); }
.msg-avatar:hover { transform: scale(1.12); border-color: var(--primary); }

/* Bubble column */
.msg-col {
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-width: 78%;
    min-width: 0;
}

.msg-group.own .msg-col { align-items: flex-end; }

/* Username */
.msg-username {
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--primary);
    padding: 0 6px;
    cursor: pointer;
}

.msg-username:hover { text-decoration: underline; }
.msg-group.own .msg-username { display: none; }

/* Bubble */
.msg-bubble {
    position: relative;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 0.92rem;
    line-height: 1.6;
    word-break: break-word;
    max-width: 100%;
    transition: background 0.2s;
}

/* Others bubble */
.msg-group:not(.own) .msg-bubble {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-bottom-right-radius: 6px;
    color: var(--text-main);
}

/* Own bubble */
.msg-group.own .msg-bubble {
    background: var(--accent-gradient);
    color: white;
    border-bottom-left-radius: 6px;
    box-shadow: 0 4px 14px rgba(139,92,246,0.3);
}

.msg-bubble:hover { filter: brightness(1.05); }

.bubble-text { white-space: pre-wrap; word-break: break-word; }

/* Sticker bubble — no background/padding, just the image */
.msg-bubble.sticker-bubble {
    background: none !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
}

/* Reply preview inside bubble */
.reply-preview {
    background: rgba(0,0,0,0.15);
    border-right: 3px solid rgba(255,255,255,0.4);
    border-radius: 8px;
    padding: 6px 10px;
    margin-bottom: 8px;
    font-size: 0.75rem;
    opacity: 0.85;
}

.msg-group:not(.own) .reply-preview {
    border-right-color: var(--primary);
    background: rgba(139,92,246,0.08);
}

.reply-preview .rp-name { font-weight: 800; margin-bottom: 2px; color: var(--primary); }
.msg-group.own .reply-preview .rp-name { color: rgba(255,255,255,0.8); }
.reply-preview .rp-text { color: var(--text-muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.msg-group.own .reply-preview .rp-text { color: rgba(255,255,255,0.7); }

/* Edited tag */
.edited-tag {
    font-size: 0.62rem;
    opacity: 0.6;
    margin-right: 4px;
}

/* Sent images */
.msg-image-img {
    display: block;
    max-width: 240px;
    max-height: 320px;
    width: 100%;
    height: auto;
    border-radius: 14px;
    cursor: pointer;
    object-fit: cover;
}

/* Stickers */
.msg-sticker-img {
    display: block;
    width: 120px;
    height: 120px;
    object-fit: contain;
    cursor: pointer;
}

/* Mentions inside message text */
.mention {
    color: var(--primary);
    font-weight: 800;
    background: rgba(139,92,246,0.15);
    padding: 1px 5px;
    border-radius: 6px;
    unicode-bidi: plaintext;
}

.msg-group.own .mention { background: rgba(255,255,255,0.2); color: #fff; }

.mention-me {
    background: rgba(250,204,21,0.28) !important;
    color: #fbbf24 !important;
}

.msg-bubble.mention-glow {
    box-shadow: 0 0 0 2px rgba(250,204,21,0.65), 0 4px 14px rgba(250,204,21,0.25);
}

/* @mention autocomplete panel */
.mention-panel {
    position: absolute;
    bottom: 78px;
    right: 10px;
    left: 10px;
    margin: 0 auto;
    max-width: 320px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    max-height: 200px;
    overflow-y: auto;
    display: none;
    z-index: 60;
    box-shadow: 0 8px 28px rgba(0,0,0,0.5);
}

.mention-panel.show { display: block; }

.mention-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--text-main);
}

.mention-item:hover { background: rgba(139,92,246,0.12); }

.mi-avatar {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--accent-gradient);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.68rem;
    font-weight: 900;
    color: white;
    flex-shrink: 0;
}

/* Code blocks inside messages */
.code-block {
    margin: 6px 0;
    border-radius: 12px;
    overflow: hidden;
    background: #0d0d18;
    border: 1px solid rgba(139,92,246,0.25);
    max-width: 100%;
}

.code-block-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    background: rgba(139,92,246,0.12);
    font-size: 0.68rem;
    font-weight: 800;
    direction: ltr;
}

.code-lang {
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.03em;
}

.code-copy-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-main);
    border-radius: 8px;
    padding: 3px 8px;
    font-size: 0.66rem;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    transition: var(--transition);
    min-width: unset;
    margin: 0;
}

.code-copy-btn:hover { background: rgba(139,92,246,0.25); filter: none; transform: none; }
.code-copy-btn.copied { background: rgba(16,185,129,0.25); border-color: rgba(16,185,129,0.4); color: #10b981; }

.code-block pre {
    margin: 0;
    padding: 10px 12px;
    overflow-x: auto;
    overflow-y: auto;
    max-height: 260px;
    direction: ltr;
    text-align: left;
}

.code-block code {
    font-family: 'Fira Code', 'Consolas', monospace;
    font-size: 0.78rem;
    line-height: 1.5;
    color: #d6d6f5;
    white-space: pre;
}

/* Meta row (time + status) */
.msg-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 6px;
}

.msg-group.own .msg-meta { flex-direction: row-reverse; }

.msg-time { font-size: 0.65rem; color: var(--text-muted); }
.msg-read  { font-size: 0.7rem; color: var(--secondary); }

/* Reactions */
.msg-reactions {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 0 4px;
}

.reaction-pill {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 50px;
    padding: 3px 8px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--text-muted);
}

.reaction-pill:hover { border-color: var(--primary); background: var(--primary-dim); transform: scale(1.1); }
.reaction-pill.mine  { border-color: var(--primary); background: var(--primary-dim); color: var(--primary); }
.reaction-pill .rp-count { font-size: 0.7rem; font-weight: 800; }

/* Hover actions (also tap-to-show on mobile via .show class) */
.msg-actions-hover {
    position: absolute;
    top: -34px;
    display: none;
    align-items: center;
    gap: 4px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 50px;
    padding: 4px 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    z-index: 10;
    white-space: nowrap;
}

.msg-group.own .msg-actions-hover { left: 0; right: auto; }
.msg-group:not(.own) .msg-actions-hover { right: 0; left: auto; }

.msg-bubble:hover .msg-actions-hover,
.msg-col:hover .msg-actions-hover,
.msg-actions-hover.show { display: flex; }

.act-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 0.9rem;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition);
    padding: 0;
    margin: 0;
    color: var(--text-muted);
    min-width: unset;
}

.act-btn:hover { background: rgba(139,92,246,0.15); color: var(--text-main); transform: scale(1.15); filter: none; }

/* Emoji picker */
.emoji-picker {
    position: absolute;
    top: -44px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 6px 10px;
    display: none;
    gap: 6px;
    z-index: 20;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    max-width: 90vw;
    overflow-x: auto;
}

.emoji-picker.show { display: flex; }
.emoji-opt { font-size: 1.2rem; cursor: pointer; transition: transform 0.15s; padding: 2px; border-radius: 6px; }
.emoji-opt:hover { transform: scale(1.35); background: rgba(139,92,246,0.1); }

/* System message */
.sys-msg {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-muted);
    padding: 6px 0;
    font-weight: 700;
}


/* ============================================================
   Reply Bar (above input)
   ============================================================ */

#replyBar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(139,92,246,0.06);
    border-top: 1px solid rgba(139,92,246,0.2);
    font-size: 0.8rem;
    flex-shrink: 0;
}

.rb-text { flex: 1; color: var(--text-muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rb-text strong { color: var(--primary); }
.rb-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; margin: 0; padding: 0; }
.rb-close:hover { color: var(--danger); filter: none; transform: none; }


/* ============================================================
   Upload Preview Bar (image about to be sent)
   ============================================================ */

#uploadBar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(139,92,246,0.06);
    border-top: 1px solid rgba(139,92,246,0.2);
    font-size: 0.8rem;
    flex-shrink: 0;
}

#uploadBar img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
.ub-text { flex: 1; color: var(--text-muted); }
.ub-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; margin: 0; padding: 0; }
.ub-close:hover { color: var(--danger); filter: none; transform: none; }


/* ============================================================
   Typing Indicator
   ============================================================ */

#typingBar {
    padding: 4px 20px;
    font-size: 0.75rem;
    color: var(--text-muted);
    min-height: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}

.typing-dots { display: flex; gap: 4px; }
.typing-dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); animation: tdot 1.2s ease infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes tdot { 0%,60%,100%{opacity:0.3;transform:translateY(0)} 30%{opacity:1;transform:translateY(-4px)} }


/* ============================================================
   Input Area
   ============================================================ */

.input-area {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg-card);
    border-top: 1px solid var(--border-color);
    flex-shrink: 0;
}

.input-wrap {
    flex: 1;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 22px;
    display: flex;
    align-items: flex-end;
    gap: 6px;
    padding: 8px 12px;
    transition: var(--transition);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
    min-width: 0;
}

.input-wrap:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(139,92,246,0.15), inset 0 2px 6px rgba(0,0,0,0.2);
}

#msgInput {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text-main);
    font-family: 'Tajawal', sans-serif;
    font-size: 0.95rem;
    line-height: 1.5;
    resize: none;
    max-height: 120px;
    overflow-y: auto;
    direction: rtl;
    min-width: 0;
}

#msgInput::placeholder { color: var(--text-muted); opacity: 0.7; }

.emoji-trigger, .media-trigger {
    background: none;
    border: none;
    font-size: 1.15rem;
    cursor: pointer;
    padding: 0;
    margin: 0;
    color: var(--text-muted);
    transition: var(--transition);
    flex-shrink: 0;
    min-width: unset;
    line-height: 1;
}

.emoji-trigger:hover, .media-trigger:hover { color: var(--text-main); transform: scale(1.2); filter: none; }

.input-side-btns {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    padding-bottom: 2px;
}

.quick-emojis {
    position: absolute;
    bottom: 78px;
    right: 10px;
    left: 10px;
    margin: 0 auto;
    max-width: 320px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 10px 14px;
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    z-index: 50;
    box-shadow: 0 8px 28px rgba(0,0,0,0.5);
    max-height: 40vh;
    overflow-y: auto;
}

.quick-emojis.show { display: flex; }
.q-emoji { font-size: 1.4rem; cursor: pointer; transition: transform 0.15s; border-radius: 8px; padding: 3px; }
.q-emoji:hover { transform: scale(1.3); background: rgba(139,92,246,0.1); }

/* Send button */
#sendBtn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--accent-gradient);
    color: white;
    border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(139,92,246,0.4);
    transition: var(--transition);
    flex-shrink: 0;
    margin: 0;
    padding: 0;
    min-width: unset;
}

#sendBtn:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(139,92,246,0.5); filter: none; }
#sendBtn:active { transform: scale(0.94); }
#sendBtn:disabled { opacity: 0.4; transform: none; }

/* Scroll to bottom button */
#scrollBtn {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent-gradient);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 8px 18px;
    font-size: 0.8rem;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    box-shadow: 0 4px 14px rgba(139,92,246,0.4);
    display: none;
    gap: 6px;
    align-items: center;
    margin: 0;
    z-index: 40;
    animation: fadeIn 0.3s ease both;
}

#scrollBtn.show { display: flex; }

/* ============================================================
   Responsive — phones
   ============================================================ */

@media (max-width: 600px) {
    .chat-header { padding: 10px 12px; gap: 8px; }
    .back-btn { font-size: 1.1rem; padding: 2px 4px; }
    .ch-icon { width: 36px; height: 36px; font-size: 1.05rem; border-radius: 12px; }
    .ch-name { font-size: 0.88rem; }
    .ch-online span#onlineCount { }
    #chatBox { padding: 10px 8px; gap: 3px; }
    .msg-col { max-width: 86%; }
    .msg-avatar { width: 28px; height: 28px; }
    .msg-bubble { padding: 8px 12px; font-size: 0.88rem; }
    .quick-emojis { right: 6px; left: 6px; bottom: 74px; }
    .msg-image-img { max-width: 190px; max-height: 260px; }
    .msg-sticker-img { width: 100px; height: 100px; }
    .code-block code { font-size: 0.72rem; }
    .code-block pre { max-height: 200px; }
    .input-area { padding: 8px 8px calc(10px + env(safe-area-inset-bottom)); }
    #sendBtn { width: 40px; height: 40px; font-size: 1rem; }
}

@media (max-width: 380px) {
    .msg-col { max-width: 90%; }
    .ch-online { display: none; }
}

</style>
</head>
<body>

<!-- Chat Header -->
<div class="chat-layout">

    <div class="chat-header">
        <button class="back-btn" onclick="location.href='index.html'" title="رجوع للصفحة الرئيسية">🔙</button>
        <div class="ch-icon">💬</div>
        <div class="ch-info">
            <div class="ch-name">شات CCRAFT SPACE</div>
            <div class="ch-status">متصل</div>
        </div>
        <div class="ch-online">
            <div class="dot"></div>
            <span id="onlineCount">—</span> أونلاين
        </div>
    </div>

    <!-- Messages -->
    <div id="chatBox"></div>

    <!-- Typing -->
    <div id="typingBar"></div>

    <!-- Reply Bar -->
    <div id="replyBar">
        <span>↩️ رد على</span>
        <div class="rb-text" id="replyText">—</div>
        <button class="rb-close" onclick="cancelReply()">✕</button>
    </div>

<script>
// Robust mobile viewport height fix: computed in JS from the REAL visible
// viewport (visualViewport when available) and applied as a CSS variable,
// so the layout can never rely on a vh unit that mobile browsers get wrong.
// Runs multiple times after load because some mobile browsers report an
// incorrect height in the first few hundred ms before their UI chrome
// (address bar / bottom bar) settles.
(function () {
    function setAppHeight() {
        const h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
        document.documentElement.style.setProperty('--app-height', h + 'px');
    }
    setAppHeight();
    window.addEventListener('load', setAppHeight);
    setTimeout(setAppHeight, 150);
    setTimeout(setAppHeight, 400);
    setTimeout(setAppHeight, 1000);
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', () => {
        setAppHeight();
        setTimeout(setAppHeight, 300);
    });
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', setAppHeight);
        window.visualViewport.addEventListener('scroll', setAppHeight);
    }
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) setAppHeight();
    });
})();
</script>

function initialsAvatarHTML(name, size) {
    const initial = (name || '?').charAt(0).toUpperCase();
    return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:${size*0.35}px">${initial}</div>`;
}

async function getAvatar(uid, size = 34, name = '') {
    if (!uid) return initialsAvatarHTML(name, size);
    if (avatarCache[uid] !== undefined) {
        return avatarCache[uid]
            ? `<img src="${avatarCache[uid]}" alt="" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;display:block">`
            : initialsAvatarHTML(name, size);
    }
    try {
        const snap = await get(ref(db, `users/${uid}/photo`));
        const photo = snap.exists() ? snap.val() : null;
        avatarCache[uid] = photo;
        return photo
            ? `<img src="${photo}" alt="" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;display:block">`
            : initialsAvatarHTML(name, size);
    } catch {
        return initialsAvatarHTML(name, size);
    }
}


/* ============================================================
   Code block + text rendering

// Map common language aliases to a clean display label
const LANG_LABELS = {
    js:'JavaScript', javascript:'JavaScript', ts:'TypeScript', typescript:'TypeScript',
    py:'Python', python:'Python', html:'HTML', css:'CSS', json:'JSON',
    java:'Java', c:'C', cpp:'C++', 'c++':'C++', cs:'C#', csharp:'C#',
    php:'PHP', sql:'SQL', bash:'Bash', sh:'Shell', shell:'Shell',
    swift:'Swift', kotlin:'Kotlin', go:'Go', rust:'Rust', ruby:'Ruby',
    xml:'XML', yaml:'YAML', yml:'YAML', dart:'Dart', txt:'Text', text:'Text'
};

// Registry of every username we've ever seen (from messages + presence),
// used to power @mention autocomplete and to know which @word is a real mention
const knownUsers = new Map(); // uid -> username

function registerUser(uid, username) {
    if (uid && username) knownUsers.set(uid, username);
}

function escapeRegex(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function linkifyMentions(escapedText) {
    // escapedText is already HTML-escaped; usernames are plain ASCII so this is safe to run after escaping
    return escapedText.replace(/@([A-Za-z0-9_.\-]+)/g, (full, uname) => {
        let isMe = false, isKnown = false;
        for (const [uid, name] of knownUsers) {
            if (name.toLowerCase() === uname.toLowerCase()) {
                isKnown = true;
                if (currentUser && uid === currentUser.uid) isMe = true;
            }
        }
        if (!isKnown) return full;
        return `<span class="mention${isMe ? ' mention-me' : ''}">@${uname}</span>`;
    });
}

function renderMessageContent(text) {
    if (!text) return '';
    const regex = /```(\w+)?[ \t]*\n?([\s\S]*?)```/g;
    let lastIndex = 0, html = '', match, found = false;
    while ((match = regex.exec(text)) !== null) {
        found = true;
        const before = text.slice(lastIndex, match.index);
        if (before) html += `<span class="msg-text-part">${linkifyMentions(escapeHTML(before))}</span>`;
        const rawLang = (match[1] || '').toLowerCase();
        const label = LANG_LABELS[rawLang] || (rawLang ? rawLang : 'نص عادي');
        const code = match[2].replace(/\n$/, '');
        html += `
            <div class="code-block">
                <div class="code-block-header">
                    <span class="code-lang">${escapeHTML(label)}</span>
                    <button class="code-copy-btn" type="button">📋 نسخ</button>
                </div>
                <pre><code>${escapeHTML(code)}</code></pre>
            </div>`;
        lastIndex = regex.lastIndex;
    }
    const after = text.slice(lastIndex);
    if (after) html += `<span class="msg-text-part">${linkifyMentions(escapeHTML(after))}</span>`;
    return found ? html : linkifyMentions(escapeHTML(text));
}

// Single delegated listener handles copy buttons for every code block ever rendered
chatBox.addEventListener('click', async e => {

    } catch {
        // fallback for older/insecure contexts
        const ta = document.createElement('textarea');
        ta.value = codeEl.textContent;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch {}
        ta.remove();
    }
    const old = btn.textContent;
    btn.textContent = '✅ تم النسخ';
    btn.classList.add('copied');

        snapshot.forEach(child => {
            const key = child.key;
            const msg = child.val();
            const el  = chatBox.querySelector(`[data-key="${key}"]`);

            const editedTag = el.querySelector('.edited-tag');
            if (editedTag && msg.edited) editedTag.style.display = 'inline';
            // Update text (re-render so ```code``` blocks stay live after an edit)
            const textEl = el.querySelector('.bubble-text');
            if (textEl && msg.type !== 'sticker') textEl.innerHTML = renderMessageContent(msg.text || '');
        });

function buildMessageHTML(msg, key, isOwn, avatarHTML, time) {

    const isMedia = msg.type === 'image' || msg.type === 'sticker';

    const myUsername = currentUser ? currentUser.email.split('@')[0].toLowerCase() : '';
    const mentionsMe = !isOwn && myUsername && msg.text &&
        new RegExp(`(^|\\s)@${escapeRegex(myUsername)}(\\s|$)`, 'i').test(msg.text + ' ');

    let contentHTML;
    if (msg.type === 'sticker') {
        contentHTML = `<img src="${msg.imageData}" class="msg-sticker-img" alt="ملصق" onclick="window.open('${msg.imageData}','_blank')">`;
    } else if (msg.type === 'image') {
        contentHTML = `

            ${msg.text ? `<div class="bubble-text" style="margin-top:8px">${renderMessageContent(msg.text)}</div>` : ''}
            ${editedHTML}
        `;
    } else {
        contentHTML = `
            ${replyHTML}

        `;
    }

    return `
        <div class="msg-avatar" onclick="location.href='profile.html?uid=${msg.userId}'">${avatarHTML}</div>
        <div class="msg-col">
            ${!isOwn ? `<div class="msg-username" onclick="location.href='profile.html?uid=${msg.userId}'">${msg.username || 'مجهول'}</div>` : ''}
            <div class="msg-bubble ${msg.type === 'sticker' ? 'sticker-bubble' : ''} ${mentionsMe ? 'mention-glow' : ''}">
                <div class="msg-actions-hover">
                    <div class="emoji-picker" id="ep-${key}">
                        ${REACT_EMOJIS.map(e=>`<span class="emoji-opt" data-emoji="${e}" data-key="${key}">${e}</span>`).join('')}
                    </div>
                    <button class="act-btn react-btn" data-key="${key}" title="تفاعل">😊</button>
                    <button class="act-btn reply-btn" data-key="${key}" title="رد">↩️</button>
                    ${isOwn && !isMedia ? `<button class="act-btn edit-btn" data-key="${key}" title="تعديل">✏️</button>` : ''}
                    ${isOwn ? `<button class="act-btn del-btn" data-key="${key}" title="حذف">🗑️</button>` : ''}
                </div>
                ${contentHTML}
            </div>
            <div class="msg-reactions">${reactionsHTML}</div>
            <div class="msg-meta">
                <span class="msg-time">${time}</span>
                ${isOwn ? '<span class="msg-read">✓✓</span>' : ''}
            </div>
        </div>
    `;
}

function buildReactionsHTML(reactions, key) {
    if (!reactions || !Object.keys(reactions).length) return '';
    const counts = {};
    const myReacts = new Set();
    Object.entries(reactions).forEach(([uid, emoji]) => {
        counts[emoji] = (counts[emoji]||0) + 1;
        if (uid === currentUser?.uid) myReacts.add(emoji);
    });
    return Object.entries(counts).map(([emoji, count]) =>
        `<span class="reaction-pill ${myReacts.has(emoji)?'mine':''}" data-emoji="${emoji}" data-key="${key}">
            ${emoji} <span class="rp-count">${count}</span>
        </span>`
    ).join('');
}

    el.querySelector('.reply-btn')?.addEventListener('click', e => {

        replyTo = { key, username: msg.username, text: previewText };
        replyBar.style.display = 'flex';

        msgInput.focus();

    // Edit
    el.querySelector('.edit-btn')?.addEventListener('click', e => {

async function toggleReaction(key, emoji) {
    if (!currentUser) return;
    const reactRef = ref(db, `chat/${key}/reactions/${currentUser.uid}`);

        await set(reactRef, emoji);
    }
}


/* ============================================================
   Image compression (canvas-based, no upload needed elsewhere)
   ============================================================ */

function compressImageFile(file, { maxDim = 1280, quality = 0.7, mimeType = 'image/jpeg' } = {}) {
    return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) { reject(new Error('ملف غير صالح')); return; }
        const reader = new FileReader();
        reader.onload = e => {
            const img = new Image();
            img.onload = () => {
                let { width, height } = img;
                if (width > maxDim || height > maxDim) {
                    if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
                    else { width = Math.round(width * maxDim / height); height = maxDim; }
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                try {
                    resolve(canvas.toDataURL(mimeType, quality));
                } catch (err) { reject(err); }
            };
            img.onerror = () => reject(new Error('تعذّر تحميل الصورة'));
            img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('تعذّرت قراءة الملف'));
        reader.readAsDataURL(file);
    });
}

   Image / Sticker Sending
   ============================================================ */

document.getElementById('stickerTrigger').onclick = () => stickerInput.click();

    const file = imageInput.files[0];
    imageInput.value = '';
    if (!file) return;
    await prepareUpload(file, 'image');

stickerInput.addEventListener('change', async () => {
    const file = stickerInput.files[0];
    stickerInput.value = '';

    await prepareUpload(file, 'sticker');

async function prepareUpload(file, type) {
    uploadBar.style.display = 'flex';
    uploadText.textContent = 'جاري ضغط الصورة...';
    uploadPreviewImg.src = '';
    sendBtn.disabled = true;
    try {
        const isSticker = type === 'sticker';
        const dataURL = await compressImageFile(file, {
            maxDim: isSticker ? STICKER_MAX_DIM : IMAGE_MAX_DIM,
            quality: isSticker ? STICKER_QUALITY : IMAGE_QUALITY,
            mimeType: isSticker ? 'image/webp' : 'image/jpeg'
        });
        if (dataURL.length > MAX_DATA_LENGTH) {
            alert('الصورة كبيرة حتى بعد الضغط، جرّب صورة أصغر.');
            cancelUpload();
            return;
        }
        pendingUpload = { dataURL, type };
        uploadPreviewImg.src = dataURL;
        const approxKB = Math.round(dataURL.length * 0.75 / 1024);
        uploadText.textContent = isSticker
            ? `ملصق جاهز للإرسال (~${approxKB}kb)`
            : `صورة جاهزة للإرسال (~${approxKB}kb) — يمكنك إضافة تعليق ثم الإرسال`;
        msgInput.focus();
    } catch (err) {
        alert('تعذّر معالجة الصورة');
        cancelUpload();
    } finally {
        sendBtn.disabled = false;
    }
}

function cancelUpload() {
    pendingUpload = null;
    uploadBar.style.display = 'none';
    uploadPreviewImg.src = '';
}

window.cancelUpload = cancelUpload;

   Send Message
   ============================================================ */

async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text && !pendingUpload) return;
    if (!currentUser) return;

    sendBtn.disabled = true;

    if (editingKey) {
        // تعديل رسالة نصيّة
        if (text) await update(ref(db, `chat/${editingKey}`), { text, edited: true });
        editingKey = null;
        msgInput.style.borderColor = '';
        msgInput.placeholder = 'اكتب رسالتك... (```code``` لإرسال كود)';
    } else if (pendingUpload) {
        const data = {
            userId:    currentUser.uid,
            username:  currentUser.email.split('@')[0],
            type:      pendingUpload.type,
            imageData: pendingUpload.dataURL,
            timestamp: Date.now(),
        };
        if (pendingUpload.type === 'image' && text) data.text = text;
        if (replyTo) {
            data.replyTo = { key: replyTo.key, username: replyTo.username, text: replyTo.text };
            replyTo = null;
            replyBar.style.display = 'none';
        }
        await push(ref(db, 'chat'), data);
        cancelUpload();
    } else {
        // رسالة نصية جديدة
        const data = {
            userId:    currentUser.uid,
            username:  currentUser.email.split('@')[0],
            text,
            timestamp: Date.now(),
        };
        if (replyTo) {
            data.replyTo = { key: replyTo.key, username: replyTo.username, text: replyTo.text };
            replyTo = null;
            replyBar.style.display = 'none';
        }
        await push(ref(db, 'chat'), data);
    }

    msgInput.value = '';
    msgInput.style.height = 'auto';
    sendBtn.disabled = false;
    msgInput.focus();
    clearTyping();
    scrollToBottom();
}

sendBtn.onclick = sendMessage;

msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function cancelReply() {
    replyTo = null;
    replyBar.style.display = 'none';
}

window.cancelReply = cancelReply;


/* ============================================================
   Auto Resize Textarea
   ============================================================ */

function autoResize() {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
}

msgInput.addEventListener('input', () => {
    autoResize();
    handleTyping();
    updateMentionPanel();
});

msgInput.addEventListener('keyup', updateMentionPanel);
msgInput.addEventListener('click', updateMentionPanel);


/* ============================================================
   @Mention Autocomplete
   ============================================================ */

function getMentionQuery() {
    const val = msgInput.value;
    const pos = msgInput.selectionStart;
    const upToCaret = val.slice(0, pos);
    const match = upToCaret.match(/(?:^|\s)@([A-Za-z0-9_.\-]*)$/);
    if (!match) return null;
    return { query: match[1], start: pos - match[1].length - 1 };
}

function updateMentionPanel() {
    const m = getMentionQuery();
    if (!m) { mentionPanel.classList.remove('show'); mentionStart = -1; return; }
    const q = m.query.toLowerCase();
    const matches = [...knownUsers.entries()]
        .filter(([uid, name]) => uid !== currentUser?.uid && name.toLowerCase().includes(q))
        .slice(0, 6);
    if (!matches.length) { mentionPanel.classList.remove('show'); mentionStart = -1; return; }
    mentionStart = m.start;
    mentionPanel.innerHTML = matches.map(([, name]) => `
        <div class="mention-item" data-username="${escapeHTML(name)}">
            <div class="mi-avatar">${escapeHTML(name.charAt(0).toUpperCase())}</div>
            <span>${escapeHTML(name)}</span>
        </div>
    `).join('');
    mentionPanel.classList.add('show');
}

mentionPanel.addEventListener('click', e => {
    const item = e.target.closest('.mention-item');
    if (!item || mentionStart < 0) return;
    const username = item.dataset.username;
    const val = msgInput.value;
    const pos = msgInput.selectionStart;
    const before = val.slice(0, mentionStart);
    const after = val.slice(pos);
    const insertion = `@${username} `;
    msgInput.value = before + insertion + after;
    const newPos = (before + insertion).length;
    mentionPanel.classList.remove('show');
    mentionStart = -1;
    msgInput.focus();
    msgInput.setSelectionRange(newPos, newPos);
    autoResize();
});

document.addEventListener('click', e => {
    if (!e.target.closest('#mentionPanel') && !e.target.closest('#msgInput'))
        mentionPanel.classList.remove('show');
});


/* ============================================================
   Typing Indicator
   ============================================================ */

function handleTyping() {
    if (!currentUser) return;
    set(ref(db, `typing/${currentUser.uid}`), { name: currentUser.email.split('@')[0], ts: Date.now() });
    clearTimeout(typingTimer);
    typingTimer = setTimeout(clearTyping, 3000);
}

function clearTyping() {
    if (!currentUser) return;
    remove(ref(db, `typing/${currentUser.uid}`));
}

function trackTyping(user) {
    onValue(ref(db, 'typing'), snap => {
        if (!snap.exists()) { typingBar.innerHTML=''; return; }
        const typers = Object.entries(snap.val())
            .filter(([uid, d]) => uid !== user.uid && Date.now() - d.ts < 4000)
            .map(([,d]) => d.name);
        if (!typers.length) { typingBar.innerHTML=''; return; }
        typingBar.innerHTML = `
            <div class="typing-dots"><span></span><span></span><span></span></div>
            <span>${typers.join('، ')} ${typers.length===1?'يكتب...':'يكتبون...'}</span>
        `;
    });
}


/* ============================================================
   Online Presence
   ============================================================ */

function trackPresence(user) {
    const presRef = ref(db, `presence/${user.uid}`);
    set(presRef, { online: true, ts: Date.now(), name: user.email.split('@')[0] });

    onValue(ref(db, 'presence'), snap => {
        if (!snap.exists()) { document.getElementById('onlineCount').innerText = '0'; return; }
        const online = Object.values(snap.val()).filter(p => p.online && Date.now() - p.ts < 60000).length;
        document.getElementById('onlineCount').innerText = online;
        Object.entries(snap.val()).forEach(([uid, p]) => registerUser(uid, p.name));
    });
}


/* ============================================================
   Scroll
   ============================================================ */

function scrollToBottom() {
    chatBox.scrollTop = chatBox.scrollHeight;
    scrollBtn.classList.remove('show');
    atBottom = true;
}

window.scrollToBottom = scrollToBottom;

chatBox.addEventListener('scroll', () => {
    const threshold = 120;
    atBottom = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < threshold;
    if (atBottom) scrollBtn.classList.remove('show');
});


/* ============================================================
   Helpers
   ============================================================ */

function escapeHTML(str) {
    return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

</script>

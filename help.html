<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCRAFT SPACE | الدعم الفني</title>
<link rel="stylesheet" href="styles.css">
<style>

body { min-height: 100svh; display: flex; flex-direction: column; }

.help-page {
    flex: 1;
    max-width: 620px;
    margin: 0 auto;
    padding: 28px 20px 80px;
    width: 100%;
    animation: fadeIn 0.5s ease both;
}

/* Hero */
.help-hero { text-align: center; margin-bottom: 32px; }

.help-hero .hh-icon {
    font-size: 3rem;
    display: block;
    margin-bottom: 14px;
    animation: float 3s ease infinite;
}

@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

.help-hero h1 {
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 900;
    background: var(--accent-gradient);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
}

.help-hero p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.7; }

/* Contact options */
.contact-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 24px;
}

.contact-pill {
    flex: 1;
    min-width: 140px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 14px 16px;
    text-decoration: none;
    transition: var(--transition);
}

.contact-pill:hover { border-color: var(--border-hover); transform: translateY(-2px); filter: none; }

.contact-pill .cp-icon { font-size: 1.3rem; flex-shrink: 0; }
.contact-pill .cp-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.contact-pill .cp-label { font-size: 0.68rem; color: var(--text-muted); font-weight: 700; }
.contact-pill .cp-value {
    font-size: 0.82rem; color: var(--text-main); font-weight: 800;
    direction: ltr; text-align: right;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* Form Card */
.form-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 26px 24px;
}

.form-card h3 {
    font-size: 0.78rem; font-weight: 800; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
}
.form-card h3::after { content:''; flex:1; height:1px; background:var(--border-color); }

.field-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }

.field-label {
    font-size: 0.78rem; font-weight: 800; color: var(--text-main);
    display: flex; align-items: center; gap: 6px;
}

.field-group input,
.field-group textarea {
    width: 100%;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 12px 16px;
    color: var(--text-main);
    font-family: 'Tajawal', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: var(--transition);
    box-sizing: border-box;
    direction: rtl;
}

.field-group input:focus,
.field-group textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(139,92,246,0.15);
}

.field-group input::placeholder,
.field-group textarea::placeholder { color: var(--text-muted); opacity: 0.6; }

.field-group textarea { resize: vertical; min-height: 130px; line-height: 1.6; }

#submitBtn {
    width: 100%;
    background: var(--accent-gradient);
    color: white; border: none;
    border-radius: var(--radius-btn);
    padding: 15px;
    font-size: 1rem; font-weight: 900;
    cursor: pointer; font-family: 'Tajawal', sans-serif;
    margin-top: 6px;
    box-shadow: 0 8px 20px rgba(139,92,246,0.3);
    transition: var(--transition);
    display: flex; align-items: center; justify-content: center; gap: 8px;
}

#submitBtn:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(139,92,246,0.4); filter: brightness(1.05); }
#submitBtn:active { transform: scale(0.97); }

.status-msg {
    display: none;
    margin-top: 16px;
    font-size: 0.82rem;
    font-weight: 700;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.6;
    align-items: center;
    gap: 8px;
}
.status-msg.show { display: flex; }
.status-msg.ok  { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3); color: #4ade80; }
.status-msg.err { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: #f87171; }

.faq-note {
    text-align: center;
    margin-top: 24px;
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.7;
}
.faq-note a { color: var(--primary); font-weight: 800; text-decoration: none; }
.faq-note a:hover { text-decoration: underline; }

@media (max-width: 480px) {
    .contact-row { flex-direction: column; }
}

</style>
</head>
<body>

<header>
    <button class="nav-button" onclick="location.href='index.html'">رجوع للصفحة الرئيسية</button>
</header>

<div class="help-page">

    <div class="help-hero">
        <span class="hh-icon">💬</span>
        <h1>الدعم الفني</h1>
        <p>عندك مشكلة أو استفسار؟ إحنا هنا نساعدك — املأ النموذج تحت أو تواصل معانا مباشرة.</p>
    </div>

    <div class="contact-row">
        <a class="contact-pill" href="mailto:ccraftspace@proton.me">
            <span class="cp-icon">📧</span>
            <span class="cp-text">
                <span class="cp-label">البريد الإلكتروني</span>
                <span class="cp-value">ccraftspace@proton.me</span>
            </span>
        </a>
        <a class="contact-pill" href="https://t.me/cCraftspace" target="_blank" rel="noopener noreferrer">
            <span class="cp-icon">✈️</span>
            <span class="cp-text">
                <span class="cp-label">تلجرام</span>
                <span class="cp-value">t.me/cCraftspace</span>
            </span>
        </a>
    </div>

    <div class="form-card">
        <h3>✍️ أرسل لنا رسالة</h3>

        <form id="supportForm">
            <div class="field-group">
                <label class="field-label" for="name">👤 الاسم</label>
                <input type="text" id="name" name="name" placeholder="اسمك..." required>
            </div>

            <div class="field-group">
                <label class="field-label" for="email">📧 بريدك الإلكتروني</label>
                <input type="email" id="email" name="email" placeholder="عشان نقدر نرد عليك..." required>
            </div>

            <div class="field-group">
                <label class="field-label" for="message">📝 الرسالة</label>
                <textarea id="message" name="message" placeholder="اشرح مشكلتك أو استفسارك هنا..." required></textarea>
            </div>

            <button type="submit" id="submitBtn">📤 إرسال</button>
        </form>

        <div class="status-msg" id="statusMsg"></div>
    </div>

    <div class="faq-note">
        قبل ما تبعت، ممكن سؤالك يكون له إجابة في <a href="privacy.html">سياسة الخصوصية</a>.
    </div>

</div>

<script>
const SUPPORT_EMAIL = 'ccraftspace@proton.me';

const form = document.getElementById('supportForm');
const statusMsg = document.getElementById('statusMsg');

function setStatus(type, msg) {
    statusMsg.className = `status-msg show ${type}`;
    statusMsg.innerHTML = msg;
}

form.addEventListener('submit', (e) => {
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const message = document.getElementById('message').value.trim();

    if (!name || !email || !message) {
        setStatus('err', '⚠️ من فضلك املأ كل الحقول');
        return;
    }

    const subject = `Support Request from ${name}`;
    const body = `${message}\n\nFrom: ${email}`;
    const mailtoLink = `mailto:${SUPPORT_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

    window.location.href = mailtoLink;

    setStatus('ok', '✅ تم فتح بريدك الإلكتروني لإرسال الرسالة — تحقق منه وأرسلها.');
    form.reset();
});
</script>
</body>
</html>

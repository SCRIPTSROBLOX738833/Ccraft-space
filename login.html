<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<title>تسجيل الدخول أو إنشاء حساب</title>
<style>
    #googleLoginBtn {
        background-color: #fff;
        color: #757575;
        border: 1px solid #ddd;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-weight: bold;
        margin-top: 10px;
        width: 100%;
        transition: background-color 0.3s;
    }
    #googleLoginBtn:hover {
        background-color: #f8f9fa;
    }
    #msg {
        margin-top: 15px;
        padding: 10px;
        border-radius: 4px;
        font-size: 14px;
        display: none;
    }
    .error-msg {
        background-color: #ffebee;
        color: #c62828;
        display: block !important;
    }
    .login-hint {
        font-size: 0.78rem;
        color: var(--text-muted);
        margin-top: 12px;
        line-height: 1.7;
    }
</style>
</head>
<body>

<div id="authContainer">
    <h1>تسجيل الدخول إلى CCRAFT SPACE</h1>
    <p>هذه الصفحة خاصة بحسابات موقع CCRAFT SPACE فقط</p>

    <button id="googleLoginBtn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo" width="18">
        تسجيل الدخول عبر جوجل
    </button>

    <p class="login-hint">
        أول ما تسجّل دخول هتحتاج تختار اسم مستخدم فريد — حسابك ما يتفعّلش
        على الموقع غير بعد اختيار الاسم.
    </p>

    <p id="msg"></p>
    <button id="privacy" class="nav-button" onclick="location.href='privacy.html'">سياسة الخصوصية</button>
    <button id="home" class="nav-button" onclick="location.href='index.html'">رجوع للصفحة الرئيسية</button>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://nthqrfsdshsreqdoksyv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_kHd5Y4bBnUDJxCFV-aKg-Q_T9XRJckN";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let redirecting = false;

const googleLoginBtn = document.getElementById("googleLoginBtn");
const msg = document.getElementById("msg");
const authContainer = document.getElementById("authContainer");

function showMessage(text, isError = true) {
    msg.textContent = text;
    msg.className = isError ? "error-msg" : "";
    msg.style.display = "block";
}

/* ============================================================
   أي اسم فاضي، أو لسه على الافتراضي "cCraft Space User" (بأي شكل
   كتابة)، بيتعامل معاه كـ "لسه مفيش اسم حقيقي" — بيمنع اعتبار
   الحساب مكتمل لحد ما يختار اسم فعلي في profile.html.
   ============================================================ */
function isPlaceholderName(name) {
    return !name || !name.trim() || /^c?craft\s*space\s*user/i.test(name.trim());
}

/* ============================================================
   بيدوّر بس — مفيش أي insert هنا خالص. إنشاء صف اليوزر في جدول
   users بيحصل حصريًا في profile.html، وبس بعد ما يختار اسم مستخدم
   صحيح ومتاح. ده يضمن إن محدش يقدر يكون "له حساب فعّال" من غير
   ما يحط اسم — ولو حصلت أي محاولة تلاعب/ثغرة تتخطى الخطوة دي،
   النتيجة العملية إنه مفيش صف اتعمل من الأساس، يعني مفيش بيانات
   زي الإيميل مخزّنة أصلًا عشان تتسرب.
   ============================================================ */
async function findExistingRow(user) {
    // محاولة 1: صف مربوط فعليًا بالـ auth_uid بتاعي
    let { data: row } = await supabase
        .from("users")
        .select("id, is_banned, username")
        .eq("auth_uid", user.id)
        .maybeSingle();
    if (row) return row;

    // محاولة 2: يوزر قديم من Firebase بنفس الإيميل لسه معملوش لينك —
    // ده بس *مطابقة*، مش تخزين إيميل جديد؛ الإيميل ده أصلًا موجود
    // من الهجرة القديمة مش بيتضاف دلوقتي.
    if (user.email) {
        const { data: byEmail } = await supabase
            .from("users")
            .select("id, is_banned, username")
            .eq("email", user.email)
            .is("auth_uid", null)
            .maybeSingle();

        if (byEmail) {
            await supabase.from("users").update({ auth_uid: user.id }).eq("id", byEmail.id);
            return byEmail;
        }
    }

    return null; // حساب جديد كليًا — لسه مفيش صف
}

async function handleUser(user) {
    if (!user) {
        localStorage.removeItem("currentUser");
        return;
    }

    try {
        const row = await findExistingRow(user);

        if (row?.is_banned === true) {
            await supabase.auth.signOut();
            localStorage.removeItem("currentUser");
            showMessage("🚫 حسابك محظور من CCRAFT SPACE. لو ده خطأ، تواصل مع الإدارة.");
            return;
        }

        // مفيش صف خالص، أو الصف موجود بس من غير اسم مستخدم حقيقي —
        // في الحالتين لازم يكمّل خطوة اختيار الاسم في profile.html
        // قبل ما نعتبر حسابه "متعمل" فعليًا على الموقع.
        if (!row || isPlaceholderName(row.username)) {
            redirecting = true;
            location.href = "profile.html";
            return;
        }

        localStorage.setItem("currentUser", user.id);

        // بنحدّث آخر دخول بس — من غير ما نلمس الإيميل أو الصورة أو
        // الاسم، عشان بيانات اليوزر تفضل تحت تحكمه هو بس من صفحة
        // البروفايل (ده كان بيسبب مشكلة إن صورة البروفايل ترجع
        // لصورة جوجل تلقائيًا مع كل تسجيل دخول).
        await supabase.from("users").update({
            last_login: new Date().toISOString(),
        }).eq("id", row.id);

        showLoggedInView(row.username);
    } catch (e) {
        console.error(e);
        showMessage("حصل خطأ أثناء تسجيل الدخول، جرب تاني.");
    }
}

function showLoggedInView(username){
    if (redirecting) return;
    authContainer.innerHTML = `
        <h2>مرحبا بك ${username}!</h2>
        <button id="logoutBtn">تسجيل خروج</button>
        <button onclick="location.href='index.html'">الصفحة الرئيسية</button>
    `;
    const logoutBtn = document.getElementById("logoutBtn");
    logoutBtn.addEventListener("click", async ()=>{
        try{
            await supabase.auth.signOut();
            window.location.reload();
        }catch(e){
            alert("حدث خطأ أثناء تسجيل الخروج");
        }
    });
}

supabase.auth.onAuthStateChange((event, session) => {
    handleUser(session?.user ?? null);
});

supabase.auth.getSession().then(({ data: { session } }) => {
    handleUser(session?.user ?? null);
});

googleLoginBtn.addEventListener("click", async () => {
    try {
        const { error } = await supabase.auth.signInWithOAuth({
            provider: "google",
            options: {
                redirectTo: window.location.href
            }
        });
        if (error) throw error;
    } catch (error) {
        console.error("Google Login Error:", error);
        showMessage("فشل تسجيل الدخول عبر جوجل: " + error.message);
    }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<title>تسجيل الدخول أو إنشاء حساب</title>
<style>
    #googleLoginBtn {
        background-color: #fff;
        color: #757575;
        border: 1px solid #ddd;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-weight: bold;
        margin-top: 10px;
        width: 100%;
        transition: background-color 0.3s;
    }
    #googleLoginBtn:hover {
        background-color: #f8f9fa;
    }
    #msg {
        margin-top: 15px;
        padding: 10px;
        border-radius: 4px;
        font-size: 14px;
        display: none;
    }
    .error-msg {
        background-color: #ffebee;
        color: #c62828;
        display: block !important;
    }
</style>
</head>
<body>

<div id="authContainer">
    <h1>تسجيل الدخول إلى CCRAFT SPACE</h1>
    <p>هذه الصفحة خاصة بحسابات موقع CCRAFT SPACE فقط</p>

    <button id="googleLoginBtn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo" width="18">
        تسجيل الدخول عبر جوجل
    </button>

    <p id="msg"></p>
    <button id="privacy" class="nav-button" onclick="location.href='privacy.html'">سياسة الخصوصية</button>
    <button id="home" class="nav-button" onclick="location.href='index.html'">رجوع للصفحة الرئيسية</button>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://nthqrfsdshsreqdoksyv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_kHd5Y4bBnUDJxCFV-aKg-Q_T9XRJckN";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let redirecting = false;

const googleLoginBtn = document.getElementById("googleLoginBtn");
const msg = document.getElementById("msg");
const authContainer = document.getElementById("authContainer");

function showMessage(text, isError = true) {
    msg.textContent = text;
    msg.className = isError ? "error-msg" : "";
    msg.style.display = "block";
}

// بيدوّر على صف اليوزر في جدول users:
// 1) الأول بالـ auth_uid (لو سبق وربطناه)
// 2) لو مفيش، بالإيميل (يوزر قديم من Firebase لسه معملش لينك)
// 3) لو مفيش خالص، معناه يوزر جديد كليًا
async function findOrLinkUserRow(user) {
    // محاولة 1: auth_uid
    let { data: row } = await supabase
        .from("users")
        .select("id, is_banned, username")
        .eq("auth_uid", user.id)
        .maybeSingle();

    if (row) return row;

    // محاولة 2: نفس الإيميل (يوزر قديم من Firebase)
    if (user.email) {
        const { data: byEmail } = await supabase
            .from("users")
            .select("id, is_banned, username")
            .eq("email", user.email)
            .is("auth_uid", null)
            .maybeSingle();

        if (byEmail) {
            // اربطه دلوقتي بالـ auth_uid الجديد
            await supabase
                .from("users")
                .update({ auth_uid: user.id })
                .eq("id", byEmail.id);
            return byEmail;
        }
    }

    // يوزر جديد تمامًا: نعمله صف جديد
    const { data: created, error } = await supabase
        .from("users")
        .insert({
            auth_uid: user.id,
            email: user.email,
            display_name: user.user_metadata?.full_name || user.user_metadata?.name || null,
            photo_url: user.user_metadata?.avatar_url || null,
            last_login: new Date().toISOString(),
        })
        .select("id, is_banned, username")
        .single();

    if (error) throw error;
    return created;
}

async function handleUser(user) {
    if (!user) {
        localStorage.removeItem("currentUser");
        return;
    }

    try {
        const row = await findOrLinkUserRow(user);

        if (row?.is_banned === true) {
            await supabase.auth.signOut();
            localStorage.removeItem("currentUser");
            showMessage("🚫 حسابك محظور من CCRAFT SPACE. لو ده خطأ، تواصل مع الإدارة.");
            return;
        }

        localStorage.setItem("currentUser", user.id);

        // تحديث بيانات آخر دخول + الصورة/الاسم (من غير ما نلمس username)
        await supabase.from("users").update({
            display_name: user.user_metadata?.full_name || user.user_metadata?.name || null,
            photo_url: user.user_metadata?.avatar_url || null,
            last_login: new Date().toISOString(),
        }).eq("id", row.id);

        const hasUsername = !!row?.username;

        if (!hasUsername) {
            redirecting = true;
            location.href = "profile.html";
            return;
        }

        showLoggedInView(user);
    } catch (e) {
        console.error(e);
        showMessage("حصل خطأ أثناء تسجيل الدخول، جرب تاني.");
    }
}

function showLoggedInView(user){
    if (redirecting) return;
    const name = user.user_metadata?.full_name || user.user_metadata?.name || "مجهول";
    authContainer.innerHTML = `
        <h2>مرحبا بك ${name}!</h2>
        <button id="logoutBtn">تسجيل خروج</button>
        <button onclick="location.href='index.html'">الصفحة الرئيسية</button>
    `;
    const logoutBtn = document.getElementById("logoutBtn");
    logoutBtn.addEventListener("click", async ()=>{
        try{
            await supabase.auth.signOut();
            window.location.reload();
        }catch(e){
            alert("حدث خطأ أثناء تسجيل الخروج");
        }
    });
}

supabase.auth.onAuthStateChange((event, session) => {
    handleUser(session?.user ?? null);
});

supabase.auth.getSession().then(({ data: { session } }) => {
    handleUser(session?.user ?? null);
});

googleLoginBtn.addEventListener("click", async () => {
    try {
        const { error } = await supabase.auth.signInWithOAuth({
            provider: "google",
            options: {
                redirectTo: window.location.href
            }
        });
        if (error) throw error;
    } catch (error) {
        console.error("Google Login Error:", error);
        showMessage("فشل تسجيل الدخول عبر جوجل: " + error.message);
    }
});
</script>
</body>
</html>

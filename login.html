)<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<title>تسجيل الدخول أو إنشاء حساب</title>
<style>
    #googleLoginBtn {
        background: linear-gradient(135deg, #7c3aed, #4f46e5);
        color: #ffffff;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-weight: bold;
        font-size: 15px;
        margin-top: 10px;
        width: 100%;
        transition: opacity 0.3s;
    }
    #googleLoginBtn:hover {
        opacity: 0.9;
    }
    #googleLoginBtn svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
    }
    #msg {
        margin-top: 15px;
        padding: 10px;
        border-radius: 4px;
        font-size: 14px;
        display: none;
    }
    .error-msg {
        background-color: #ffebee;
        color: #c62828;
        display: block !important;
    }
    .login-hint {
        font-size: 0.78rem;
        color: var(--text-muted);
        margin-top: 12px;
        line-height: 1.7;
    }
</style>
</head>
<body>

<div id="authContainer">
    <h1>تسجيل الدخول إلى CCRAFT SPACE</h1>
    <p>هذه الصفحة خاصة بحسابات موقع CCRAFT SPACE فقط</p>

    <button id="googleLoginBtn">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#ffffff"/>
            <path d="M2 17L12 22L22 17" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        الدخول بحساب Google
    </button>

    <p class="login-hint">
        أول ما تسجّل دخول هتحتاج تختار اسم مستخدم فريد — حسابك ما يتفعّلش
        على الموقع غير بعد اختيار الاسم.
    </p>

    <p id="msg"></p>
    <button id="privacy" class="nav-button" onclick="location.href='privacy.html'">سياسة الخصوصية</button>
    <button id="home" class="nav-button" onclick="location.href='index.html'">رجوع للصفحة الرئيسية</button>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://nthqrfsdshsreqdoksyv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_kHd5Y4bBnUDJxCFV-aKg-Q_T9XRJckN";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let redirecting = false;

const googleLoginBtn = document.getElementById("googleLoginBtn");
const msg = document.getElementById("msg");
const authContainer = document.getElementById("authContainer");

function showMessage(text, isError = true) {
    msg.textContent = text;
    msg.className = isError ? "error-msg" : "";
    msg.style.display = "block";
}

function isPlaceholderName(name) {
    return !name || !name.trim() || /^c?craft\s*space\s*user/i.test(name.trim());
}

async function findExistingRow(user) {
    let { data: row } = await supabase
        .from("users")
        .select("id, is_banned, username")
        .eq("auth_uid", user.id)
        .maybeSingle();
    if (row) return row;

    if (user.email) {
        const { data: byEmail } = await supabase
            .from("users")
            .select("id, is_banned, username")
            .eq("email", user.email)
            .is("auth_uid", null)
            .maybeSingle();

        if (byEmail) {
            await supabase.from("users").update({ auth_uid: user.id }).eq("id", byEmail.id);
            return byEmail;
        }
    }

    return null;
}

async function handleUser(user) {
    if (!user) {
        localStorage.removeItem("currentUser");
        return;
    }

    try {
        const row = await findExistingRow(user);

        if (row?.is_banned === true) {
            await supabase.auth.signOut();
            localStorage.removeItem("currentUser");
            showMessage("🚫 حسابك محظور من CCRAFT SPACE. لو ده خطأ، تواصل مع الإدارة.");
            return;
        }

        if (!row || isPlaceholderName(row.username)) {
            redirecting = true;
            location.href = "profile.html";
            return;
        }

        localStorage.setItem("currentUser", user.id);

        await supabase.from("users").update({
            last_login: new Date().toISOString(),
        }).eq("id", row.id);

        showLoggedInView(row.username);
    } catch (e) {
        console.error(e);
        showMessage("حصل خطأ أثناء تسجيل الدخول، جرب تاني.");
    }
}

function showLoggedInView(username){
    if (redirecting) return;
    authContainer.innerHTML = `
        <h2>مرحبا بك ${username}!</h2>
        <button id="logoutBtn">تسجيل خروج</button>
        <button onclick="location.href='index.html'">الصفحة الرئيسية</button>
    `;
    const logoutBtn = document.getElementById("logoutBtn");
    logoutBtn.addEventListener("click", async ()=>{
        try{
            await supabase.auth.signOut();
            window.location.reload();
        }catch(e){
            alert("حدث خطأ أثناء تسجيل الخروج");
        }
    });
}

supabase.auth.onAuthStateChange((event, session) => {
    handleUser(session?.user ?? null);
});

supabase.auth.getSession().then(({ data: { session } }) => {
    handleUser(session?.user ?? null);
});

googleLoginBtn.addEventListener("click", async () => {
    try {
        const { error } = await supabase.auth.signInWithOAuth({
            provider: "google",
            options: {
                redirectTo: window.location.href
            }
        });
        if (error) throw error;
    } catch (error) {
        console.error("Google Login Error:", error);
        showMessage("فشل تسجيل الدخول عبر جوجل: " + error.message);
    }
});
</script>
</body>
</html>
